CREATE EXTENSION IF NOT EXISTS "pgcrypto";

-- 1. Tabel Periode & Tarif Kas Tahunan
CREATE TABLE IF NOT EXISTS public.periode_kas (
  id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
  tahun INT UNIQUE NOT NULL,
  tarif_bulanan BIGINT NOT NULL DEFAULT 20000,
  keterangan TEXT,

  peran TEXT NOT NULL DEFAULT 'Perawat',

CREATE TABLE IF NOT EXISTS public.iuran_kas (

);

CREATE TABLE IF NOT EXISTS public.patungan_event (

  nama_event TEXT NOT NULL,
  tahun INT NOT NULL REFERENCES public.periode_kas(tahun) ON DELETE RESTRICT,

  subsidi_kas BIGINT CHECK (subsidi_kas >= 0),

  terposting_ke_kas BOOLEAN NOT NULL DEFAULT FALSE,
  keterangan TEXT,
  created_at TIMESTAMPTZ DEFAULT NOW()
);

-- 6. Tabel Peserta Patungan (mendukung anggota internal & peserta eksternal/dokter)
CREATE TABLE IF NOT EXISTS public.patungan_peserta (
  id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
  patungan_id UUID NOT NULL REFERENCES public.patungan_event(id) ON DELETE CASCADE,

  nama_peserta TEXT NOT NULL,
  tarif_target BIGINT NOT NULL DEFAULT 0,
  nominal_bayar BIGINT NOT NULL DEFAULT 0,
  status_bayar TEXT NOT NULL DEFAULT 'Belum Bayar' CHECK (status_bayar IN ('Lunas', 'Belum Bayar')),
  keterangan TEXT,
  created_at TIMESTAMPTZ DEFAULT NOW()
);

-- 7. Tabel Transaksi Kas (Pemasukan Lain & Pengeluaran)
CREATE TABLE IF NOT EXISTS public.transaksi_kas (

  bulan SMALLINT NOT NULL CHECK (bulan BETWEEN 1 AND 12),

  kategori TEXT NOT NULL,
  deskripsi TEXT NOT NULL,

  patungan_id UUID REFERENCES public.patungan_event(id) ON DELETE SET NULL,
  created_at TIMESTAMPTZ DEFAULT NOW()
);

create or replace function public.posting_patungan(p_event uuid, p_tanggal date)
returns void language plpgsql security invoker set search_path = '' as $$
declare
  acara public.patungan_event%rowtype;
  terkumpul bigint;
  subsidi bigint;
  sisa bigint;
begin
  select * into strict acara from public.patungan_event where id = p_event for update;
  if acara.terposting_ke_kas then return; end if;
  if extract(year from p_tanggal) <> acara.tahun or p_tanggal is null then
    raise exception 'Tanggal posting harus berada pada tahun acara.';
  end if;
  select coalesce(sum(nominal_bayar), 0) into terkumpul from public.patungan_peserta where patungan_id = p_event;
  subsidi := coalesce(acara.subsidi_kas, greatest(acara.total_pengeluaran - terkumpul, 0));
  sisa := terkumpul + subsidi - acara.total_pengeluaran;
  if sisa < 0 then raise exception 'Dana peserta dan subsidi belum menutup biaya acara.'; end if;
  if subsidi > 0 then
    insert into public.transaksi_kas(tahun,bulan,tanggal,tipe,kategori,deskripsi,nominal,patungan_id)
    values(acara.tahun,extract(month from p_tanggal),p_tanggal,'keluar','Defisit Patungan','Subsidi kas — ' || acara.nama_event,subsidi,p_event);
  end if;
  if sisa > 0 then
    insert into public.transaksi_kas(tahun,bulan,tanggal,tipe,kategori,deskripsi,nominal,patungan_id)
    values(acara.tahun,extract(month from p_tanggal),p_tanggal,'masuk_lain','Sisa Patungan','Sisa Patungan — ' || acara.nama_event,sisa,p_event);
  end if;
  update public.patungan_event set terposting_ke_kas=true, status='Selesai' where id=p_event;
end;
$$;
revoke all on function public.posting_patungan(uuid,date) from public, anon;
grant execute on function public.posting_patungan(uuid,date) to authenticated;


create or replace function public.buat_patungan_dengan_anggota(p_id uuid, p_acara jsonb, p_anggota uuid[])
returns uuid language plpgsql security invoker set search_path = '' as $$
declare
  saved uuid;
  expected integer;
  added integer;
  rate bigint := (p_acara->>'tarif_default')::bigint;
begin
  if nullif(trim(p_acara->>'nama_event'),'') is null or rate is null or rate < 0 then
    raise exception 'Nama acara dan tarif yang valid diperlukan.';
  end if;
  insert into public.patungan_event
    (id,nama_event,tahun,status,tarif_default,total_pengeluaran,subsidi_kas,catatan_tarif,keterangan)
  values (p_id,trim(p_acara->>'nama_event'),(p_acara->>'tahun')::int,p_acara->>'status',
    rate,(p_acara->>'total_pengeluaran')::bigint,(p_acara->>'subsidi_kas')::bigint,
    p_acara->>'catatan_tarif',p_acara->>'keterangan')
  on conflict (id) do nothing returning id into saved;
  if saved is null then return p_id; end if;
  select count(distinct item) into expected from unnest(p_anggota) as u(item);
  insert into public.patungan_peserta
    (patungan_id,anggota_id,nama_peserta,tarif_target,nominal_bayar,status_bayar,keterangan)
  select saved,a.id,a.nama,rate,0,case when rate=0 then 'Lunas' else 'Belum Bayar' end,a.peran
  from public.anggota a where a.id=any(p_anggota);
  get diagnostics added = row_count;
  if added <> expected then raise exception 'Daftar anggota berubah. Muat ulang dan periksa pilihan peserta.'; end if;
  return saved;
end;
$$;
revoke all on function public.buat_patungan_dengan_anggota(uuid,jsonb,uuid[]) from public, anon;
grant execute on function public.buat_patungan_dengan_anggota(uuid,jsonb,uuid[]) to authenticated;

    /* ============================================================================
       UTILITAS PEMBANTU (FORMATTER, ESCAPE HTML, UUID, CLIPBOARD, TOAST)
    ============================================================================ */
    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatRp(amount, showPlus = false) {
      const num = Number(amount) || 0;
      const abs = Math.abs(num);
      const formatted = new Intl.NumberFormat('id-ID').format(abs);
      if (num < 0) return `-Rp ${formatted}`;
      if (num > 0 && showPlus) return `+Rp ${formatted}`;
      return `Rp ${formatted}`;
    }

    function formatCompactRp(amount) {
      const num = Number(amount) || 0;
      const abs = Math.abs(num);
      const sign = num < 0 ? '-' : '';
      if (abs >= 1000000) return `${sign}Rp ${(abs / 1000000).toFixed(2).replace('.', ',')} jt`;
      if (abs >= 1000) return `${sign}Rp ${Math.round(abs / 1000)} rb`;
      return `${sign}Rp ${abs}`;
    }

    function formatDateId(dateStr) {
      if (!dateStr) return '-';
      const d = new Date(dateStr + 'T00:00:00');
      if (isNaN(d.getTime())) return dateStr;
      return d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
    }

    function generateUuid() {
      if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => {
        const r = (Math.random() * 16) | 0;
        const v = c === 'x' ? r : (r & 0x3) | 0x8;
        return v.toString(16);
      });
    }

    function copyTextToClipboard(text, successMsg = 'Berhasil disalin ke clipboard') {
      try {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.left = '-9999px';
        textarea.style.top = '0';
        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(textarea);
        if (ok) showToast(successMsg, 'success');
        else showToast('Gagal menyalin teks. Silakan salin manual.', 'error');
      } catch (err) {
        showToast('Gagal menyalin teks: ' + err.message, 'error');
      }
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const id = 'toast-' + Date.now() + Math.random().toString(36).slice(2, 6);
      const styles = {
        success: 'bg-emerald-50/95 border-emerald-200 text-emerald-800',
        error: 'bg-rose-50/95 border-rose-200 text-rose-800',
        warning: 'bg-amber-50/95 border-amber-200 text-amber-800',

    /* ============================================================================
       MODAL CONTROLLER (TANPA alert() / confirm())
    ============================================================================ */
    function formatMoneyInput(input) {
      const before = input.value;
      const digits = before.replace(/\./g, '');
      input.setCustomValidity('');
      if (digits && !/^\d+$/.test(digits)) {
        input.setCustomValidity('Gunakan angka rupiah bulat tanpa tanda minus atau koma.');
        return;
      }
      if (!digits) { input.value = ''; return; }
      const amount = Number(digits);
      if (!Number.isSafeInteger(amount) || amount < Number(input.dataset.min || 0)) input.setCustomValidity('Periksa nominal rupiah.');
      const remaining = before.slice(input.selectionStart ?? before.length).replace(/\D/g, '').length;
      input.value = digits.replace(/^0+(?=\d)/,'').replace(/\B(?=(\d{3})+(?!\d))/g,'.');
      let cursor = input.value.length;
      for (let n = 0; cursor > 0 && n < remaining;) {
        if (/\d/.test(input.value[--cursor])) n++;
      }
      input.setSelectionRange(cursor,cursor);
    }

    function moneyValue(id) { return Number(document.getElementById(id).value.replace(/\./g,'')); }

    function openModal(htmlContent, maxWidthClass = 'max-w-lg') {
      const root = document.getElementById('modal-root');
      root.innerHTML = `
        <div class="w-full ${maxWidthClass} bg-white rounded-2xl shadow-2xl border border-slate-200/90 overflow-hidden animate-fade-up my-auto max-h-[90vh] flex flex-col" onclick="event.stopPropagation()">
          ${htmlContent}
        </div>
      `;
      root.classList.remove('hidden');
      root.onclick = null;
      root.querySelectorAll('[data-money]').forEach(input => {
        formatMoneyInput(input);
        input.addEventListener('input', () => formatMoneyInput(input));
      });
      if (window.lucide) lucide.createIcons();
    }

    function closeModal() {
      const root = document.getElementById('modal-root');
      root.classList.add('hidden');
      root.innerHTML = '';
    }

    function openConfirmModal({ title, message, confirmLabel = 'Ya, Lanjutkan', danger = false, onConfirm }) {
      const btnColor = danger
        ? 'bg-rose-600 hover:bg-rose-700 text-white'
        : 'bg-teal-700 hover:bg-teal-800 text-white';
      const iconBg = danger ? 'bg-rose-50 text-rose-600' : 'bg-teal-50 text-teal-700';
      const iconName = danger ? 'trash-2' : 'help-circle';

      window.__pendingConfirm = async () => {
        closeModal();
        if (typeof onConfirm === 'function') await onConfirm();
      };

      openModal(`
        <div class="p-6">
          <div class="flex items-start gap-4">
            <div class="w-11 h-11 rounded-2xl ${iconBg} flex items-center justify-center shrink-0">
              <i data-lucide="${iconName}" class="w-5 h-5"></i>
            </div>
            <div class="flex-1 min-w-0">
              <h3 class="text-base font-bold text-slate-900">${escapeHtml(title)}</h3>
              <p class="text-sm text-slate-600 mt-1.5 leading-relaxed">${escapeHtml(message)}</p>
            </div>
          </div>
          <div class="flex items-center justify-end gap-2.5 mt-6">
            <button onclick="closeModal()" class="px-4 py-2.5 rounded-xl text-sm font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 transition active:scale-[0.98]">
              Batal
            </button>
            <button onclick="window.__pendingConfirm()" class="px-4 py-2.5 rounded-xl text-sm font-semibold ${btnColor} transition active:scale-[0.98] shadow-sm">
              ${escapeHtml(confirmLabel)}
            </button>
          </div>
        </div>
      `, 'max-w-md');
    }

    /* ============================================================================
       DUAL-ENGINE DATA ADAPTER (SUPABASE LIVE + MODE DEMO FALLBACK)
    ============================================================================ */
    const DB = {
      mode: 'demo', // 'supabase' | 'demo'
      client: null,
      url: '',
      key: '',

      init() {
        const savedUrl = (DEFAULT_SUPABASE_URL || '').trim();
        const savedKey = (DEFAULT_SUPABASE_ANON_KEY || '').trim();
        this.url = savedUrl;
        this.key = savedKey;

        if (savedUrl && savedKey && window.supabase && typeof window.supabase.createClient === 'function') {
          try {
            this.client = window.supabase.createClient(savedUrl.replace(/\/rest\/v1\/?$/, ''), savedKey);
            this.mode = 'supabase';
          } catch (e) {
            console.error('Supabase init error:', e);
            this.mode = 'demo';
            this.client = null;
          }
        } else {
          this.mode = 'demo';
          this.client = null;
          this.ensureDemoData();
        }
      },

      ensureDemoData() {
        const raw = localStorage.getItem(STORAGE_KEYS.DEMO_DB);
        if (!raw) {
          const seed = buildDemoSeedData();
          localStorage.setItem(STORAGE_KEYS.DEMO_DB, JSON.stringify(seed));
        }
      },

      getDemoStore() {
        this.ensureDemoData();
        try {
          return JSON.parse(localStorage.getItem(STORAGE_KEYS.DEMO_DB));
        } catch {
          const seed = buildDemoSeedData();
          localStorage.setItem(STORAGE_KEYS.DEMO_DB, JSON.stringify(seed));
          return seed;
        }
      },

      saveDemoStore(store) {
        localStorage.setItem(STORAGE_KEYS.DEMO_DB, JSON.stringify(store));
      },

      resetDemoStore() {
        const seed = buildDemoSeedData();
        this.saveDemoStore(seed);
      },

      async readPages(table, column = 'id', ascending = true) {
        const rows = [];
        const size = 500;
        for (let offset = 0; ; offset += size) {
          let query = this.client.from(table).select('*').order(column, { ascending });
          if (column !== 'id') query = query.order('id');
          const { data, error } = await query.range(offset, offset + size - 1);
          if (error) throw new Error(error.message);
          rows.push(...data);
          if (data.length < size) return { data: rows };
        }
      },

      async fetchAll() {
        if (this.mode === 'supabase') {
          const [p, a, i, lb, t, pe, pp] = await Promise.all([
            this.readPages('periode_kas', 'tahun', true),
            this.readPages('anggota', 'nama', true),
            this.readPages('iuran_kas'),
            this.readPages('saldo_lebih_bayar'),
            this.readPages('transaksi_kas', 'tanggal', false),
            this.readPages('patungan_event', 'tahun', false),
            this.readPages('patungan_peserta', 'nama_peserta', true),
          ]);
          
          return {
            periode_kas: p.data || [],
            anggota: a.data || [],
            iuran_kas: i.data || [],
            saldo_lebih_bayar: lb.data || [],
            transaksi_kas: t.data || [],
            patungan_event: pe.data || [],
            patungan_peserta: pp.data || [],
          };
        } else {
          return this.getDemoStore();
        }
      },

      // Hybrid Login: Admin via Supabase Auth
      async loginAdmin(email, password) {
        if (this.mode === 'supabase') {
          const { data, error } = await this.client.auth.signInWithPassword({ email, password });
          if (error) throw new Error(error.message);
          return {
            role: data.user.app_metadata?.kas_role === 'it_support' ? 'it_support' : 'admin',
            nama: data.user?.email?.split('@')[0] || 'Bendahara IPD 32',
            email: data.user?.email,
            id: data.user?.id,
          };
        } else {
          if (!email || !password) throw new Error('Email dan password wajib diisi.');
          return {
            role: 'admin',
            nama: 'Bendahara IPD 32',
            email: email,
            id: 'demo-admin',
          };
        }
      },

      // Hybrid Login: Anggota via validasi tabel `anggota`
      async loginAnggota(username, password) {
        const u = username.trim().toLowerCase();
        const p = password.trim();
        if (!u || !p) throw new Error('Username dan password wajib diisi.');

        if (this.mode === 'supabase') {
          const { data, error } = await this.client
            .from('anggota')
            .select('*')
            .ilike('username', u)
            .eq('password', p)
            .maybeSingle();
          if (error) throw new Error(error.message);
          if (!data) throw new Error('Username atau password anggota tidak ditemukan.');
          return {
            role: 'anggota',
            id: data.id,
            nama: data.nama,
            username: data.username,
            peran: data.peran,
            status: data.status,
          };
        } else {
          const store = this.getDemoStore();
          const found = store.anggota.find(
            (m) => m.username.toLowerCase() === u && m.password === p
          );
          if (!found) throw new Error('Username atau password tidak cocok. (Demo: atika / 123)');
          return {
            role: 'anggota',
            id: found.id,
            nama: found.nama,
            username: found.username,
            peran: found.peran,
            status: found.status,
          };
        }
      },

      async logout() {
        if (this.mode === 'supabase') {
          try {
            await this.client.auth.signOut();
          } catch (_) {}
        }
        localStorage.removeItem(STORAGE_KEYS.SESSION);
      },

      // Generic CRUD operations
      async upsertIuran(record) {
        if (this.mode === 'supabase') {
          const { error } = await this.client
            .from('iuran_kas')
            .upsert(record, { onConflict: 'anggota_id,tahun,bulan' });
          if (error) throw new Error(error.message);
        } else {
          const store = this.getDemoStore();
          const idx = store.iuran_kas.findIndex(
            (x) => x.anggota_id === record.anggota_id && x.tahun === record.tahun && x.bulan === record.bulan
          );
          if (idx >= 0) store.iuran_kas[idx] = { ...store.iuran_kas[idx], ...record };
          else store.iuran_kas.push({ id: generateUuid(), ...record });
          this.saveDemoStore(store);
        }
      },

      async deleteIuran(anggota_id, tahun, bulan) {
        if (this.mode === 'supabase') {
          const { error } = await this.client
            .from('iuran_kas')
            .delete()
            .eq('anggota_id', anggota_id)
            .eq('tahun', tahun)
            .eq('bulan', bulan);
          if (error) throw new Error(error.message);
        } else {
          const store = this.getDemoStore();
          store.iuran_kas = store.iuran_kas.filter(
            (x) => !(x.anggota_id === anggota_id && x.tahun === tahun && x.bulan === bulan)
          );
          this.saveDemoStore(store);
        }
      },

      async upsertLebihBayar(record) {
        if (this.mode === 'supabase') {
          const { error } = await this.client
            .from('saldo_lebih_bayar')
            .upsert({ ...record, updated_at: new Date().toISOString() }, { onConflict: 'anggota_id,tahun' });
          if (error) throw new Error(error.message);
        } else {
          const store = this.getDemoStore();
          const idx = store.saldo_lebih_bayar.findIndex(
            (x) => x.anggota_id === record.anggota_id && x.tahun === record.tahun
          );
          if (idx >= 0) store.saldo_lebih_bayar[idx] = { ...store.saldo_lebih_bayar[idx], ...record };
          else store.saldo_lebih_bayar.push({ id: generateUuid(), ...record });
          this.saveDemoStore(store);
        }
      },

      async insertRow(table, payload) {
        if (this.mode === 'supabase') {
          const { data, error } = await this.client.from(table).insert(payload).select().single();
          if (error) throw new Error(error.message);
          return data;
        } else {
          const store = this.getDemoStore();
          const row = { id: generateUuid(), ...payload };
          store[table].push(row);
          this.saveDemoStore(store);
          return row;
        }
      },

      async insertRows(table, payloads) {
        if (!payloads.length) return;
        if (this.mode === 'supabase') {
          const { error } = await this.client.from(table).insert(payloads);
          if (error) throw new Error(error.message);
        } else {
          const store = this.getDemoStore();
          payloads.forEach((p) => store[table].push({ id: generateUuid(), ...p }));
          this.saveDemoStore(store);
        }
      },

      async updateRow(table, id, payload) {
        if (this.mode === 'supabase') {
          const { error } = await this.client.from(table).update(payload).eq('id', id);
          if (error) throw new Error(error.message);
        } else {
          const store = this.getDemoStore();
          const idx = store[table].findIndex((x) => x.id === id);
          if (idx >= 0) store[table][idx] = { ...store[table][idx], ...payload };
          this.saveDemoStore(store);
        }
      },

      async deleteRow(table, id) {
        if (this.mode === 'supabase') {
          const { error } = await this.client.from(table).delete().eq('id', id);
          if (error) throw new Error(error.message);
        } else {
          const store = this.getDemoStore();
          store[table] = store[table].filter((x) => x.id !== id);
          // Cascade manual di mode demo
          if (table === 'anggota') {
            store.iuran_kas = store.iuran_kas.filter((x) => x.anggota_id !== id);
            store.saldo_lebih_bayar = store.saldo_lebih_bayar.filter((x) => x.anggota_id !== id);
          } else if (table === 'patungan_event') {
            store.patungan_peserta = store.patungan_peserta.filter((x) => x.patungan_id !== id);
          }
          this.saveDemoStore(store);
        }
      },
    };

    /* ============================================================================
       PERHITUNGAN KEUANGAN & REKAP TAHUNAN OTOMATIS
    ============================================================================ */
    function computeAnnualRecap() {
      const years = getAvailableYears();
      let runningSaldo = 0;
      const rows = years.map((yr) => {
        const periode = State.data.periode_kas.find((p) => Number(p.tahun) === yr);
        const tarif = periode ? Number(periode.tarif_bulanan) : 0;

        const totalIuran = State.data.iuran_kas
          .filter((i) => Number(i.tahun) === yr)
          .reduce((acc, cur) => acc + (Number(cur.nominal) || 0), 0);

        const totalLebihBayar = State.data.saldo_lebih_bayar
          .filter((lb) => Number(lb.tahun) === yr)
          .reduce((acc, cur) => acc + (Number(cur.nominal) || 0), 0);

        const totalMasukLain = State.data.transaksi_kas
          .filter((t) => Number(t.tahun) === yr && t.tipe === 'masuk_lain')
          .reduce((acc, cur) => acc + (Number(cur.nominal) || 0), 0);

        const totalKeluar = State.data.transaksi_kas
          .filter((t) => Number(t.tahun) === yr && t.tipe === 'keluar')
          .reduce((acc, cur) => acc + (Number(cur.nominal) || 0), 0);

        const totalMasuk = totalIuran + totalLebihBayar + totalMasukLain;
        const saldoTahun = totalMasuk - totalKeluar;
        runningSaldo += saldoTahun;

        return {
          tahun: yr,
          tarif,
          totalIuran,
          totalLebihBayar,
          totalMasukLain,
          totalMasuk,
          totalKeluar,
          saldoTahun,
          saldoKumulatif: runningSaldo,
        };
      });

      const grandMasuk = rows.reduce((a, r) => a + r.totalMasuk, 0);
      const grandKeluar = rows.reduce((a, r) => a + r.totalKeluar, 0);
      const grandSaldo = grandMasuk - grandKeluar;

      return { rows, grandMasuk, grandKeluar, grandSaldo };
    }

    function computePatunganStats(eventId) {
      const ev = State.data.patungan_event.find((e) => e.id === eventId);
      if (!ev) return { terkumpul: 0, targetTotal: 0, pengeluaran: 0, selisih: 0, lunasCount: 0, totalPeserta: 0 };
      const list = State.data.patungan_peserta.filter((p) => p.patungan_id === eventId);
      const terkumpul = list.reduce((a, p) => a + (Number(p.nominal_bayar) || 0), 0);
      const targetTotal = list.reduce((a, p) => a + (Number(p.tarif_target) || 0), 0);
      const pengeluaran = Number(ev.total_pengeluaran) || 0;
      const selisih = terkumpul - pengeluaran;
      const lunasCount = list.filter((p) => p.status_bayar === 'Lunas').length;
      return { terkumpul, targetTotal, pengeluaran, selisih, lunasCount, totalPeserta: list.length };
    }

    /* ============================================================================
       MAIN RENDERER
    ============================================================================ */
    const tableOrders = new Map();
    const idCollator = new Intl.Collator('id', { numeric: true, sensitivity: 'base' });

    function installTableSorting(root) {
      for (const table of root.querySelectorAll('table')) {
        if (!table.tHead || !table.tBodies.length) continue;
        const headers = Array.from(table.tHead.rows[0].cells);
        const key = headers.map(th => th.textContent.trim()).join('|');
        const body = table.tBodies[0];
        function applyOrder(column, direction) {
          headers.forEach((th, i) => th.setAttribute('aria-sort', i !== column ? 'none' : direction === 1 ? 'ascending' : 'descending'));
          function value(row) {
            const cell = row.cells[column];
            const raw = cell.dataset.value ?? cell.textContent.trim();
            if (/^[+-]?Rp\s*[\d.]+$/.test(raw)) return Number(raw.replace(/[^0-9+-]/g, ''));
            return raw;
          }
          const rows = Array.from(body.rows).filter(row => row.cells.length === headers.length);
          rows.sort((a, b) => {
            const left = value(a), right = value(b);
            return direction * (typeof left === 'number' && typeof right === 'number' ? left - right : idCollator.compare(left, right));
          });
          body.append(...rows);
        }
        headers.forEach((th, column) => {
          if (th.textContent.trim() === 'Aksi') return;
          const button = document.createElement('button');
          button.type = 'button';
          button.textContent = th.textContent.trim();
          button.title = 'Urutkan berdasarkan ' + button.textContent;
          button.onclick = () => {
            const previous = tableOrders.get(key);
            const direction = previous?.column === column ? -previous.direction : 1;
            tableOrders.set(key, { column, direction });
            applyOrder(column, direction);
          };
          th.replaceChildren(button);
        });
        const order = tableOrders.get(key);
        if (order) applyOrder(order.column, order.direction);
      }
    }

    function updateSearch(input) {
      const { id, value, selectionStart, selectionEnd } = input;
      State[id] = value;
      renderApp();
      const next = document.getElementById(id);
      next.focus({ preventScroll: true });
      next.setSelectionRange(selectionStart, selectionEnd);
    }

    function renderApp() {

      if (!State.session) {
        root.innerHTML = renderLoginScreen();
      } else {
        root.innerHTML = renderShell();

      installTableSorting(root);

    async function handleLoginSubmit(e) {
      e.preventDefault();
      const identifier = document.getElementById('login-identifier')?.value || '';
      const password = document.getElementById('login-password')?.value || '';
      const btn = document.getElementById('login-submit-btn');
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = `<span class="w-4 h-4 border-2 border-white/40 border-t-white rounded-full animate-spin"></span><span>Memverifikasi...</span>`;
      }

      try {
        const session =
          identifier.trim().includes('@')
            ? await DB.loginAdmin(identifier.trim(), password)
            : await DB.loginAnggota(identifier, password);

        State.session = session;
        State.dashboardScope = 'personal';
        State.activePage = 'dashboard';
        localStorage.setItem(STORAGE_KEYS.SESSION, JSON.stringify(session));
        showToast(`Selamat datang, ${session.nama}!`, 'success');
        await refreshData();
      } catch (err) {
        showToast(err.message || 'Login gagal.', 'error');
        renderApp();
      }
    }

    async function handleLogout() {
      openConfirmModal({
        title: 'Keluar dari Aplikasi?',
        message: 'Sesi Anda saat ini akan diakhiri dan Anda akan kembali ke halaman login.',
        confirmLabel: 'Keluar',
        danger: true,
        onConfirm: async () => {
          await DB.logout();
          State.session = null;
          resetAuditView();
          State.activePatunganId = null;
          showToast('Anda telah keluar.', 'info');
          renderApp();
        },
      });
    }

      const paidSlots = summaries.reduce((sum, months) => sum + months.filter(m => m.remaining === 0).length, 0);
      const progressPct = expectedSlots > 0 ? Math.min(100, Math.round((paidSlots / expectedSlots) * 100)) : 0;

      const recentTx = [...State.data.transaksi_kas]
        .sort((a, b) => (b.tanggal || '').localeCompare(a.tanggal || ''))

    /* ============================================================================
       4. PAGE: MATRIKS IURAN KAS 12 BULAN
    ============================================================================ */
    function membershipForYear(member, year) {
      const joined = /\b(20\d{2})\b/.exec(member.aktif_sejak || '');
      if (joined && Number(joined[1]) > year) return null;
      const years = (member.catatan_status || '').match(/\b20\d{2}\b/g) || [];
      const left = /\b(?:resign|mutasi|pindah|keluar|tidak aktif setelah)\b[^.;\n]{0,45}?\b(20\d{2})\b/i.exec(member.catatan_status || '');
      if (member.status !== 'Aktif' && left && years.length === 1) {
        if (year > Number(left[1])) return null;
        if (year < Number(left[1])) return 'Aktif';
      }
      return member.status;
    }

    function memberDues(member, year, rate, today = new Date()) {
      const start = String(member.aktif_sejak || '').toLowerCase();
      const first = start.includes(String(year)) ? MONTHS.find(m => start.includes(m.full.toLowerCase()))?.num || 1 : 1;
      const last = year === today.getFullYear() ? today.getMonth() + 1 : year < today.getFullYear() ? 12 : 0;
      const paid = new Map(State.data.iuran_kas
        .filter(i => i.anggota_id === member.id && Number(i.tahun) === year)
        .map(i => [Number(i.bulan), Number(i.nominal)]));
      return MONTHS.filter(m => m.num >= first && m.num <= last)
        .map(m => ({ ...m, remaining: Math.max(0, rate - (paid.get(m.num) || 0)) }));
    }

    function memberBalanceForYear(member,year,throughMonth) {
      const status = membershipForYear(member,year);
      const rate=getTarifForYear(year);
      let months=status ? memberDues(member,year,rate,new Date(year,11,31)).filter(m=>m.num<=throughMonth) : [];
      let note='';
      if (status && status!=='Aktif') {
        const text=(member.catatan_status||'').toLowerCase();
        const end=MONTHS.find(m=>text.includes(m.full.toLowerCase()) || new RegExp('\\b'+m.short.toLowerCase()+'(?:t)?\\b').test(text));
        if(end && text.includes(String(year))) months=months.filter(m=>m.num<=end.num);
        else if(!text.includes(`setelah ${year}`)){
          months=months.filter(m=>State.data.iuran_kas.some(p=>p.anggota_id===member.id && Number(p.tahun)===year && Number(p.bulan)===m.num));
          note='Batas kewajiban anggota nonaktif belum lengkap. Bulan yang belum memiliki setoran perlu dikonfirmasi bendahara.';
        }
      }
      const now=new Date();
      const pending = months.filter(m=>m.remaining>0).map(m=>({
        ...m, target:rate, paid:rate-m.remaining,
        future:year>now.getFullYear() || (year===now.getFullYear() && m.num>now.getMonth()+1)
      }));
      const events = new Map(State.data.patungan_event.filter(e=>Number(e.tahun)===year).map(e=>[e.id,e.nama_event]));
      const unpaid = State.data.patungan_peserta.filter(p=>p.anggota_id===member.id && events.has(p.patungan_id) && Number(p.tarif_target)>Number(p.nominal_bayar))
        .map(p=>({name:events.get(p.patungan_id),target:Number(p.tarif_target),paid:Number(p.nominal_bayar),remaining:Number(p.tarif_target)-Number(p.nominal_bayar)}));
      return {year,pending,unpaid,note};
    }

    function yearOptions(year) {
      return `<option value="0" ${!year?'selected':''}>Semua tahun</option>`+getAvailableYears().map(y=>`<option value="${y}" ${y===year?'selected':''}>${y}</option>`).join('');
    }

    function memberBalanceCard(member, year, throughMonth = 12, showHeading = true) {
      if (!member) return '';
      const years = year ? [year] : getAvailableYears();
      const periods = years.map(y => memberBalanceForYear(member,y,throughMonth));
      const sum = (rows,key) => rows.reduce((total,row)=>total+row[key],0);
      const yearly = periods.map(p=>{
        const dues = sum(p.pending,'remaining');
        const future = sum(p.pending.filter(m=>m.future),'remaining');
        const events = sum(p.unpaid,'remaining');
        return {year:p.year, dues, future, events, total:dues+events};
      });
      const total = sum(yearly,'total');
      const future = sum(yearly,'future');
      const cues = [
        ['Total belum dibayar',total,'total','wallet'], ['Sisa iuran',sum(yearly,'dues'),'dues','calendar-days'],
        ['Sisa patungan',sum(yearly,'events'),'events','users'], ['Iuran belum jatuh tempo',future,'future','clock']
      ];
      const duesRows = periods.flatMap(p=>p.pending.map(m=>[m.full+' '+p.year,m.future?'Belum jatuh tempo':'Belum lunas',formatRp(m.target),formatRp(m.paid),formatRp(m.remaining)]));
      const eventRows = periods.flatMap(p=>p.unpaid.map(e=>[e.name,p.year,formatRp(e.target),formatRp(e.paid),formatRp(e.remaining)]));
      return `<section class="space-y-4">${showHeading?`<h3 class="font-bold text-slate-900">${escapeHtml(member.nama)} · ${year||'Semua tahun'}</h3>`:''}
        <div class="report-tiles">${cues.map(([label,v,tone,icon])=>`<div class="report-tile tile-${tone}"><i data-lucide="${icon}" aria-hidden="true"></i><p>${label}</p><strong>${formatRp(v)}</strong></div>`).join('')}</div>
        <p class="text-xs text-slate-500">Total mencakup iuran sampai ${MONTHS[throughMonth-1].full}, termasuk bulan mendatang, serta sisa patungan tahun acara.</p>
        ${reportTable('Rekap per tahun',['Tahun','Sisa iuran','Sisa patungan','Total belum dibayar'],yearly.filter(y=>y.total>0).map(y=>[y.year,formatRp(y.dues),formatRp(y.events),formatRp(y.total)]),'Tidak ada sisa tagihan yang tercatat.')}
        ${reportTable('Rincian iuran',['Bulan','Status','Target','Dibayar','Sisa'],duesRows,'Tidak ada sisa iuran pada periode ini.')}
        ${reportTable('Rincian patungan',['Acara','Tahun','Target','Dibayar','Sisa'],eventRows,'Tidak ada sisa patungan pada periode ini.')}
        ${periods.filter(p=>p.note).map(p=>`<p class="text-xs text-slate-500">${p.year} · ${p.note}</p>`).join('')}</section>`;
    }

    function reportTable(title, headers, rows, empty = '', cellAction = null) {
      const [tone,icon] = ({
        'Rincian iuran':['dues','calendar-days'],'Rincian patungan':['events','users'],
        'Patungan acara':['events','users'],'Penggunaan dana':['expense','arrow-up-right'],
        'Arus kas':['general','arrow-left-right']
      })[title] || ['general','landmark'];
      const cells = rows.map((row,rowIndex) => `<tr class="hover:bg-slate-50/70 transition">${row.map((v,i) => `<td class="px-4 py-3 ${i ? 'text-right whitespace-nowrap tabular-nums font-semibold' : 'text-left font-medium'}">${cellAction?.(v,i,rowIndex) ?? escapeHtml(String(v))}</td>`).join('')}</tr>`).join('');
      return `<section class="glass-card rounded-2xl overflow-hidden min-w-0">
        <h3 class="report-section-title section-${tone}"><i aria-hidden="true" data-lucide="${icon}"></i>${title}</h3>${rows.length
        ? `<div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="bg-slate-50/95 border-y border-slate-200 text-[11px] font-bold uppercase tracking-wider text-slate-500">${headers.map((h,i) => `<th scope="col" class="px-4 py-3 whitespace-nowrap ${i ? 'text-right' : 'text-left'}">${h}</th>`).join('')}</tr></thead><tbody class="divide-y divide-slate-200/70">${cells}</tbody></table></div>`
        : `<p class="px-5 pb-5 text-sm text-slate-500">${empty}</p>`}</section>`;
    }

    function openExpenseMonth(year,month) {
      State.txYearFilter=String(year);
      State.txMonthFilter=String(month);
      State.txTypeFilter='keluar';
      State.txSearch='';
      navigateTo('transaksi');

    function renderReportPage() {
      if (!isAdmin()) return '';
      const reportYear = State.reportYear ?? Number(State.selectedYear);
      const year = reportYear || getAvailableYears().at(-1);
      const month = reportYear ? State.reportMonth : 0;
      const annual = computeAnnualRecap().rows.find(r => r.tahun === year);
      if (!annual || !State.data.periode_kas.length) return '<p>Data periode kas belum tersedia.</p>';
      const total = records => records.reduce((sum, r) => sum + Number(r.nominal || 0), 0);
      const tx = State.data.transaksi_kas.filter(r => Number(r.tahun) === year);
      const dues = State.data.iuran_kas.filter(r => Number(r.tahun) === year);
      const months = MONTHS.map(m => {
        const entries = tx.filter(r => Number(r.bulan) === m.num);
        const iuran = total(dues.filter(r => Number(r.bulan) === m.num));
        const other = total(entries.filter(r => r.tipe === 'masuk_lain'));
        const spent = total(entries.filter(r => r.tipe === 'keluar'));
        return { ...m, iuran, other, spent, net: iuran + other - spent };
      });
      const selected = month ? [months[month - 1]] : months;
      const opening = annual.saldoKumulatif - annual.saldoTahun + months.filter(m => m.num < month).reduce((s,m) => s + m.net, 0);
      const income = selected.reduce((s,m) => s + m.iuran + m.other, month ? 0 : annual.totalLebihBayar);
      const spent = selected.reduce((s,m) => s + m.spent, 0);
      const summary = [
        ['Saldo awal', opening, 'wallet', 'bg-sky-50 text-sky-700'],
        ['Pemasukan', income, 'arrow-down-left', 'bg-emerald-50 text-emerald-700'],
        ['Pengeluaran', spent, 'arrow-up-right', 'bg-rose-50 text-rose-700'],
        ['Saldo akhir', opening + income - spent, 'landmark', 'bg-teal-50 text-teal-700'],
      ];
      const categories = new Map();
      for (const row of tx.filter(r => r.tipe === 'keluar' && (!month || Number(r.bulan) === month))) {
        const key = row.kategori || 'Lainnya';
        categories.set(key, (categories.get(key) || 0) + Number(row.nominal));
      }
      const events = State.data.patungan_event.filter(e => Number(e.tahun) === year);
      const periodLabel = reportYear ? `${month ? MONTHS[month - 1].full : 'Tahun'} ${year}` : 'Semua tahun';
      const selectStyle = 'rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm font-semibold text-slate-700 focus:ring-2 focus:ring-teal-600/25';
      return `<div class="space-y-5 animate-fade-up">
        <div class="report-banner ${State.reportMember?'personal-banner':'general-banner'}">
          <div><h1>Laporan Anggota</h1><p>${State.reportMember?'Tagihan per anggota':'Rekap kas ruangan'} · ${periodLabel}</p></div>
          <button class="inline-flex items-center justify-center gap-2 self-start sm:self-auto px-4 py-2.5 rounded-xl bg-white hover:bg-slate-100 text-teal-900 text-xs font-bold shadow-sm transition active:scale-[0.98]" onclick="printMemberReport()"><i data-lucide="printer" class="w-4 h-4"></i>Cetak / Simpan PDF</button>
        </div>
        <div class="glass-card rounded-2xl p-4 grid grid-cols-2 sm:flex sm:items-end gap-3">
          <label class="grid gap-1.5 text-xs font-semibold text-slate-500">Tahun<select class="${selectStyle}" id="report-year" onchange="State.reportYear=Number(this.value);renderApp()">${yearOptions(reportYear)}</select></label>
          <label class="grid gap-1.5 text-xs font-semibold text-slate-500">Periode<select class="${selectStyle}" ${reportYear ? '' : 'disabled'} onchange="State.reportMonth=Number(this.value);renderApp()"><option value="0">Tahunan</option>${MONTHS.map(m=>`<option value="${m.num}" ${month===m.num?'selected':''}>${m.full}</option>`).join('')}</select></label>
          <label class="grid gap-1.5 text-xs font-semibold text-slate-500 col-span-2">Jenis laporan<select class="${selectStyle}" onchange="State.reportMember=this.value;renderApp()"><option value="">Rekap kas bersama</option>${State.data.anggota.map(m=>`<option value="${escapeHtml(m.id)}" ${State.reportMember===m.id?'selected':''}>Tagihan · ${escapeHtml(m.nama)}</option>`).join('')}</select></label>
        </div>
        <article id="member-report" class="space-y-4">
        <header class="hidden"><h2>Laporan Kas IPD 32</h2><p>${periodLabel} · Disusun ${new Date().toLocaleDateString('id-ID')}</p></header>
        ${State.reportMember ? memberBalanceCard(State.data.anggota.find(m=>m.id===State.reportMember),reportYear,month||12) : !reportYear ? reportTable('Rekap kas semua tahun',['Tahun','Pemasukan','Pengeluaran','Saldo tahun','Saldo kumulatif'],computeAnnualRecap().rows.map(r=>[r.tahun,formatRp(r.totalMasuk),formatRp(r.totalKeluar),formatRp(r.saldoTahun),formatRp(r.saldoKumulatif)])) : `<div class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4">${summary.map(([label,v,icon,tone])=>`<div class="report-tile ${tone}">
          <div class="flex items-center justify-between gap-1 mb-3"><span class="text-[11px] font-bold uppercase tracking-wider text-slate-500">${label}</span>
          <span aria-hidden="true" class="w-7 h-7 sm:w-9 sm:h-9 shrink-0 rounded-xl flex items-center justify-center ${tone}"><i data-lucide="${icon}" class="w-4 h-4"></i></span></div>
          <strong class="text-base sm:text-xl xl:text-2xl font-extrabold tabular-nums ${v < 0 ? 'text-rose-700' : 'text-slate-900'}">${formatRp(v)}</strong></div>`).join('')}</div>
        ${reportTable('Arus kas', ['Bulan','Iuran','Masuk lain','Keluar','Selisih'],selected.map(m=>[m.full,...[m.iuran,m.other,m.spent,m.net].map(v=>formatRp(v))]), '', (v,col,row)=>col===3 ? `<button class="text-teal-700 underline" onclick="openExpenseMonth(${year},${selected[row].num})" title="Rincian pengeluaran ${selected[row].full}">${escapeHtml(v)}</button>` : null)}

        ${reportTable('Penggunaan dana', ['Kategori','Jumlah'], [...categories].sort((a,b)=>b[1]-a[1]).map(([k,v])=>[k,formatRp(v)]),'Belum ada pengeluaran tercatat pada periode ini.')}

        ${!month && events.length ? '<p class="text-sm">Dampak patungan pada saldo mengikuti transaksi yang tercatat di Buku Kas.</p>' : ''}`}</article></div>`;

    function printMemberReport() {
      const report = document.getElementById('member-report');
      if (!isAdmin() || !report) return;
      const preview = window.open('', '_blank');
      if (!preview) return showToast('Izinkan jendela cetak untuk menyimpan PDF.', 'error');
      const doc = preview.document;
      doc.title = 'Laporan Kas IPD 32 - ' + report.querySelector('header p').textContent.split(' · ')[0];
      doc.documentElement.lang = 'id';
      const style = doc.createElement('style');
      style.textContent = '@page{size:A4;margin:14mm}body{font:11pt Arial;color:#173536}h2,h3{break-after:avoid}article svg{display:none}.report-tiles,article>.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.report-tile{border:1px solid #cbd5e1;padding:6px}.report-tile strong{font-variant-numeric:tabular-nums}table{width:100%;border-collapse:collapse}th,td{padding:5px;border-bottom:1px solid #ccc;text-align:right}th:first-child,td:first-child{text-align:left}th button{all:unset}tr{break-inside:avoid}p{margin:8px 0}';
      doc.head.append(style);
      doc.body.append(doc.importNode(report,true));
      preview.focus();
      preview.print();
    }

    function renderIuranPage() {
      const years = getAvailableYears();
      const activeYr = Number(State.selectedYear);
      const tarif = getTarifForYear(activeYr);
      const admin = isAdmin();

      // Index pembayaran untuk pencarian cepat O(1)
      const iuranMap = {};
      State.data.iuran_kas
        .filter((i) => Number(i.tahun) === activeYr)
        .forEach((i) => {
          iuranMap[`${i.anggota_id}_${i.bulan}`] = i;
        });

      const lebihMap = {};
      State.data.saldo_lebih_bayar
        .filter((l) => Number(l.tahun) === activeYr)
        .forEach((l) => {
          lebihMap[l.anggota_id] = l;
        });

      // Filter anggota
      const searchQ = State.iuranSearch.trim().toLowerCase();
      const eligible = State.data.anggota
        .map(member => ({ ...member, status: membershipForYear(member, activeYr) }))
        .filter(member => member.status)
        .map((m) => {
          const due = memberDues(m, activeYr, tarif, new Date(activeYr, 11, 31));
          let totalBayar = 0;
          for (let b = 1; b <= 12; b++) {
            const cell = iuranMap[`${m.id}_${b}`];
            if (cell && Number(cell.nominal) > 0) {
              totalBayar += Number(cell.nominal);
            }
          }
          const lebihObj = lebihMap[m.id];
          const lebihNominal = lebihObj ? Number(lebihObj.nominal) : 0;
          const derivedStatus =
            m.status !== 'Aktif' ? m.status : !due.length ? 'Belum jatuh tempo' :
            due.some(month => month.remaining > 0) ? 'Kurang Bayar' : 'Lunas';

          return { member: m, totalBayar, lebihNominal, lebihObj, derivedStatus };
        });
      const rows = eligible.filter((r) => {
          if (searchQ && !r.member.nama.toLowerCase().includes(searchQ)) return false;
          if (State.iuranStatusFilter === 'Semua') return true;
          if (State.iuranStatusFilter === 'Aktif') return r.member.status === 'Aktif';
          if (State.iuranStatusFilter === 'Lunas') return r.derivedStatus === 'Lunas';
          if (State.iuranStatusFilter === 'Kurang Bayar') return r.derivedStatus === 'Kurang Bayar';
          if (State.iuranStatusFilter === 'Non-Aktif') return r.member.status !== 'Aktif';
          return true;
        });

      // Hitung total per bulan di footer
      const monthTotals = Array(13).fill(0);
      let grandIuran = 0;
      let grandLebih = 0;
      rows.forEach((r) => {
        grandIuran += r.totalBayar;
        grandLebih += r.lebihNominal;
        for (let b = 1; b <= 12; b++) {
          const c = iuranMap[`${r.member.id}_${b}`];
          if (c) monthTotals[b] += Number(c.nominal) || 0;
        }
      });

      const statusPill = (st) => {
        if (st === 'Lunas') return `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-50 text-emerald-700 border border-emerald-200/70">Lunas</span>`;

            ${

                ? `<button type="button" onclick="removeIuranCell('${anggotaId}', ${tahun}, ${bulan})" class="px-3.5 py-2.5 rounded-xl text-xs font-semibold text-rose-700 bg-rose-50 hover:bg-rose-100 transition">Hapus Bayar</button>`

    function checkIuranAnomaly(val, tarif) {
      const el = document.getElementById('iu-anomaly-warn');
      if (!el) return;
      if (Number(val) > tarif * 2) el.classList.remove('hidden');
      else el.classList.add('hidden');
    }

    async function saveIuranCell(e, anggota_id, tahun, bulan) {
      e.preventDefault();
      const nominal = moneyValue('iu-nominal') || 0;
      const tanggal_bayar = document.getElementById('iu-tanggal').value || new Date().toISOString().slice(0, 10);
      const keterangan = document.getElementById('iu-ket').value.trim();
      try {
        if (nominal <= 0) {
          await DB.deleteIuran(anggota_id, tahun, bulan);
          showToast('Pembayaran bulan tersebut dikosongkan.', 'info');
        } else {
          await DB.upsertIuran({ anggota_id, tahun, bulan, nominal, tanggal_bayar, keterangan });
          showToast('Iuran berhasil disimpan.', 'success');
        }
        closeModal();
        await refreshData(true);
      } catch (err) {
        showToast('Gagal menyimpan iuran: ' + err.message, 'error');
      }
    }

    async function removeIuranCell(anggota_id, tahun, bulan) {
      try {
        await DB.deleteIuran(anggota_id, tahun, bulan);
        closeModal();
        showToast('Catatan pembayaran dihapus.', 'info');

    function printIuran() {
      const preview = window.open('', '_blank');
      if (!preview) return showToast('Izinkan jendela cetak untuk menyimpan PDF.', 'error');
      const doc = preview.document;
      doc.documentElement.lang = 'id';
      doc.title = 'Matriks Iuran Kas ' + State.selectedYear;
      const heading = doc.createElement('h1');
      heading.textContent = doc.title;
      const table = doc.createElement('table');
      for (const section of document.getElementById('matrix').children) {
        const target = doc.createElement(section.localName);
        for (const source of section.rows) {
          const row = target.insertRow();
          for (const cell of source.cells) {
            const copy = doc.createElement(cell.localName);
            copy.colSpan = cell.colSpan;
            copy.textContent = cell.hasAttribute('data-value') ? formatRp(cell.dataset.value) : cell.innerText.trim();
            row.append(copy);
          }
        }
        table.append(target);
      }
      const style = doc.createElement('style');
      style.textContent = '@page{size:A4 landscape;margin:8mm}body{font:9px Arial}table{width:100%;border-collapse:collapse}td,th{padding:3px;border:1px solid #aaa}tr{break-inside:avoid}tfoot{display:table-row-group}';
      doc.head.append(style);
      doc.body.append(heading, table);
      preview.focus();
      preview.print();
    }

    function exportIuranCsv() {
      const yr = Number(State.selectedYear);
      const iuranMap = {};
      State.data.iuran_kas.filter((i) => Number(i.tahun) === yr).forEach((i) => { iuranMap[`${i.anggota_id}_${i.bulan}`] = i.nominal; });
      const lebihMap = {};
      State.data.saldo_lebih_bayar.filter((l) => Number(l.tahun) === yr).forEach((l) => { lebihMap[l.anggota_id] = l.nominal; });

      const headers = ['No', 'Nama', 'Peran', 'Status anggota', 'Status iuran tahunan', ...MONTHS.map((m) => m.short), 'Total Iuran', 'Lebih Bayar'];
      const lines = [headers.join(',')];
      Array.from(document.querySelectorAll('#matrix tbody tr[data-member]')).forEach((row, idx) => {
        const m = State.data.anggota.find(member => member.id === row.dataset.member);
        let tot = 0;
        const mCols = MONTHS.map((mo) => {
          const v = Number(iuranMap[`${m.id}_${mo.num}`]) || 0;
          tot += v;
          return v;
        });
        const lb = Number(lebihMap[m.id]) || 0;
        lines.push([idx + 1, `"${m.nama.replace(/"/g, '""')}"`, m.peran, row.dataset.status, row.dataset.paymentStatus, ...mCols, tot, lb].join(','));
      });

      const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Matriks_Iuran_IPD32_${yr}.csv`;
      a.click();
      URL.revokeObjectURL(url);
      showToast(`File CSV Matriks ${yr} berhasil diunduh.`, 'success');
    }

    function renderTransaksiPage() {
      const years = getAvailableYears();
      const admin = isAdmin();
      const q = State.txSearch.trim().toLowerCase();

      const filtered = State.data.transaksi_kas
        .filter((t) => {
          if (State.txYearFilter !== 'Semua' && String(t.tahun) !== String(State.txYearFilter)) return false;
          if (State.txMonthFilter !== 'Semua' && String(t.bulan) !== String(State.txMonthFilter)) return false;
          if (State.txTypeFilter !== 'Semua' && t.tipe !== State.txTypeFilter) return false;
          if (q && !(t.deskripsi.toLowerCase().includes(q) || t.kategori.toLowerCase().includes(q))) return false;
          return true;
        })
        .sort((a, b) => (b.tanggal || '').localeCompare(a.tanggal || ''));

      const sumIn = filtered.filter((t) => t.tipe === 'masuk_lain').reduce((a, b) => a + Number(b.nominal), 0);

      return `

            <div>

              admin
                ? `

                  <i data-lucide="plus" class="w-4 h-4"></i>
                  <span>Catat Transaksi</span>
                </button>
              `
                : ''
            }
          </div>

          <!-- Ringkasan Filter -->
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <div class="glass-card rounded-2xl p-4 flex items-center justify-between">
              <div>
                <div class="text-[11px] font-bold uppercase tracking-wider text-slate-500">Pemasukan Lain</div>
                <div class="text-lg font-extrabold tabular-nums text-emerald-700 mt-1">${formatRp(sumIn)}</div>
              </div>
              <div class="w-9 h-9 rounded-xl bg-emerald-50 text-emerald-700 flex items-center justify-center"><i data-lucide="arrow-down-left" class="w-4 h-4"></i></div>
            </div>
            <div class="glass-card rounded-2xl p-4 flex items-center justify-between">
              <div>
                <div class="text-[11px] font-bold uppercase tracking-wider text-slate-500">Total Pengeluaran</div>
                <div class="text-lg font-extrabold tabular-nums text-rose-700 mt-1">${formatRp(sumOut)}</div>

            </div>

                <div class="text-[11px] font-bold uppercase tracking-wider text-slate-500">Selisih Non-Iuran</div>
                <div class="text-lg font-extrabold tabular-nums ${sumIn - sumOut >= 0 ? 'text-teal-700' : 'text-rose-700'} mt-1">${formatRp(sumIn - sumOut, true)}</div>
              </div>
              <div class="w-9 h-9 rounded-xl bg-sky-50 text-sky-600 flex items-center justify-center"><i data-lucide="scale" class="w-4 h-4"></i></div>
            </div>
          </div>

          <!-- Filter Bar -->
          <div class="glass-card rounded-2xl p-3.5 flex flex-col md:flex-row gap-2.5 items-stretch md:items-center justify-between">
            <div class="flex flex-wrap items-center gap-2">
              <select onchange="State.txYearFilter=this.value; renderApp();" class="px-3 py-2 rounded-xl border border-slate-200 bg-white text-xs font-bold text-slate-800">
                <option value="Semua" ${State.txYearFilter === 'Semua' ? 'selected' : ''}>Semua Tahun</option>
                ${years.map((y) => `<option value="${y}" ${String(State.txYearFilter) === String(y) ? 'selected' : ''}>Tahun ${y}</option>`).join('')}
              </select>
              <select onchange="State.txMonthFilter=this.value; renderApp();" class="px-3 py-2 rounded-xl border border-slate-200 bg-white text-xs font-semibold text-slate-700">
                <option value="Semua" ${State.txMonthFilter === 'Semua' ? 'selected' : ''}>Semua Bulan</option>
                ${MONTHS.map((m) => `<option value="${m.num}" ${String(State.txMonthFilter) === String(m.num) ? 'selected' : ''}>${m.full}</option>`).join('')}
              </select>
              <select onchange="State.txTypeFilter=this.value; renderApp();" class="px-3 py-2 rounded-xl border border-slate-200 bg-white text-xs font-semibold text-slate-700">
                <option value="Semua" ${State.txTypeFilter === 'Semua' ? 'selected' : ''}>Semua Tipe</option>
                <option value="masuk_lain" ${State.txTypeFilter === 'masuk_lain' ? 'selected' : ''}>Pemasukan Lain</option>
                <option value="keluar" ${State.txTypeFilter === 'keluar' ? 'selected' : ''}>Pengeluaran</option>
              </select>
            </div>
            <div class="relative md:w-64">
              <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>

                id="txSearch" oninput="updateSearch(this)"

                    <th class="py-3.5 px-4">Tipe & Kategori</th>
                    <th class="py-3.5 px-4">Deskripsi</th>
                    <th class="py-3.5 px-4 text-right">Nominal</th>

                  </tr>

                <tbody class="divide-y divide-slate-200/70 text-sm">
                  ${
                    filtered.length === 0
                      ? `<tr><td colspan="${admin ? 5 : 4}" class="py-12 text-center text-slate-400">Tidak ada transaksi pada filter ini.</td></tr>`
                      : filtered
                          .map((tx) => {
                            const isIn = tx.tipe === 'masuk_lain';
                            return `
                              <tr class="hover:bg-slate-50/70 transition">
                                <td data-value="${escapeHtml(tx.tanggal)}" class="py-3.5 px-4 whitespace-nowrap text-xs font-semibold text-slate-600 tabular-nums">

                                  <div>${escapeHtml(tx.deskripsi)}</div>

                                  isIn ? 'text-emerald-700' : 'text-rose-700'

                                  ${isIn ? '+' : '-'}${formatRp(tx.nominal)}

                                ${
                                  admin
                                    ? `
                                    <td class="py-3.5 px-4 text-right whitespace-nowrap">
                                      <button onclick="openTransaksiModal('${tx.id}')" title="Edit" class="p-1.5 rounded-lg text-slate-500 hover:bg-slate-100 hover:text-teal-700"><i data-lucide="pencil" class="w-4 h-4"></i></button>
                                      <button onclick="deleteTransaksi('${tx.id}')" title="Hapus" class="p-1.5 rounded-lg text-slate-500 hover:bg-rose-50 hover:text-rose-700"><i data-lucide="trash-2" class="w-4 h-4"></i></button>

                                    : ''

              </table>
            </div>
          </div>
        </div>
      `;

    function openTransaksiModal(editId = null) {
      if (!isAdmin()) return;
      const tx = editId ? State.data.transaksi_kas.find((t) => t.id === editId) : null;
      const defaultDate = tx?.tanggal || new Date().toISOString().slice(0, 10);
      const defaultTipe = tx?.tipe || 'keluar';

      const buildKategoriOptions = (tipe, selectedCat) => {
        const list = tipe === 'masuk_lain' ? KATEGORI_MASUK : KATEGORI_KELUAR;
        const merged = selectedCat && !list.includes(selectedCat) ? [selectedCat, ...list] : list;
        return merged.map((c) => `<option value="${escapeHtml(c)}" ${c === selectedCat ? 'selected' : ''}>${escapeHtml(c)}</option>`).join('');
      };

      window.__onTxTypeChange = (val) => {
        const sel = document.getElementById('tx-kategori');
        if (sel) sel.innerHTML = buildKategoriOptions(val, '');
      };

      openModal(`
        <div class="p-5 border-b border-slate-200 flex items-center justify-between">
          <h3 class="text-base font-bold text-slate-900">${tx ? 'Edit Transaksi Kas' : 'Catat Transaksi Baru'}</h3>
          <button onclick="closeModal()" class="p-1.5 rounded-xl text-slate-400 hover:bg-slate-100"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        <form onsubmit="saveTransaksi(event, '${editId || ''}')" class="p-5 space-y-4">
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Tipe Transaksi</label>
              <select id="tx-tipe" onchange="window.__onTxTypeChange(this.value)" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm font-semibold">
                <option value="keluar" ${defaultTipe === 'keluar' ? 'selected' : ''}>Pengeluaran (-)</option>
                <option value="masuk_lain" ${defaultTipe === 'masuk_lain' ? 'selected' : ''}>Pemasukan Lain (+)</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Tanggal</label>
              <input id="tx-tanggal" type="date" required value="${defaultDate}" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm" />
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Kategori</label>
            <select id="tx-kategori" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm">
              ${buildKategoriOptions(defaultTipe, tx?.kategori || '')}
            </select>
          </div>

          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Nominal (Rp)</label>
            <input id="tx-nominal" type="text" inputmode="numeric" data-money data-min="1" required value="${tx?.nominal || ''}" placeholder="Contoh: 250000"
              class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm font-bold tabular-nums" />
          </div>

          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Deskripsi / Keterangan</label>
            <textarea id="tx-deskripsi" rows="2" required placeholder="Contoh: Besuk keluarga perawat / Fee Cordlife"
              class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm">${escapeHtml(tx?.deskripsi || '')}</textarea>
          </div>

          <div class="flex justify-end gap-2 pt-3 border-t border-slate-200">
            <button type="button" onclick="closeModal()" class="px-4 py-2.5 rounded-xl text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200">Batal</button>
            <button type="submit" class="px-4 py-2.5 rounded-xl text-xs font-semibold text-white bg-teal-700 hover:bg-teal-800 shadow-sm">Simpan Transaksi</button>
          </div>
        </form>
      `, 'max-w-md');
    }

    async function saveTransaksi(e, editId) {
      e.preventDefault();
      const tipe = document.getElementById('tx-tipe').value;
      const tanggal = document.getElementById('tx-tanggal').value;
      const kategori = document.getElementById('tx-kategori').value;
      const nominal = moneyValue('tx-nominal') || 0;
      const deskripsi = document.getElementById('tx-deskripsi').value.trim();
      const dt = new Date(tanggal + 'T00:00:00');
      const tahun = dt.getFullYear();
      const bulan = dt.getMonth() + 1;

      const payload = { tahun, bulan, tanggal, tipe, kategori, deskripsi, nominal };
      try {
        if (editId) {
          await DB.updateRow('transaksi_kas', editId, payload);
          showToast('Transaksi berhasil diperbarui.', 'success');
        } else {
          await DB.insertRow('transaksi_kas', { ...payload, patungan_id: null });
          showToast('Transaksi baru tercatat.', 'success');
        }
        closeModal();
        await refreshData(true);
      } catch (err) {
        showToast('Gagal menyimpan transaksi: ' + err.message, 'error');
      }
    }

    function deleteTransaksi(id) {
      if (!isAdmin()) return;
      openConfirmModal({
        title: 'Hapus Transaksi Ini?',
        message: 'Data transaksi akan dihapus permanen dan saldo kas kumulatif akan dihitung ulang otomatis.',
        confirmLabel: 'Hapus Permanen',
        danger: true,
        onConfirm: async () => {
          try {
            await DB.deleteRow('transaksi_kas', id);
            showToast('Transaksi dihapus.', 'info');
            await refreshData(true);
          } catch (err) {
            showToast('Gagal menghapus: ' + err.message, 'error');
          }
        },
      });
    }

    /* ============================================================================
       6. PAGE: PATUNGAN & ACARA (LIST + DETAIL PESERTA + POSTING KE KAS)
    ============================================================================ */
    function subsidyLabel(ev,stats) {
      return ev.subsidi_kas==null ? `${formatRp(Math.max(0,-stats.selisih))} (otomatis)` : formatRp(ev.subsidi_kas);
    }

      if (State.activePatunganId) {
        return renderPatunganDetail(State.activePatunganId);
      }

      const admin = isAdmin();
      const years = [...new Set(State.data.patungan_event.map((p) => Number(p.tahun)))].sort((a, b) => b - a);
      const filtered = State.data.patungan_event.filter((ev) => {
        if (!ev.nama_event.toLowerCase().includes(State.patSearch.trim().toLowerCase())) return false;
        if (State.patYearFilter !== 'Semua' && String(ev.tahun) !== String(State.patYearFilter)) return false;
        if (State.patStatusFilter !== 'Semua' && ev.status !== State.patStatusFilter) return false;
        return true;
      });

      let totTerkumpul = 0, totKeluar = 0;
      filtered.forEach((ev) => {
        const s = computePatunganStats(ev.id);
        totTerkumpul += s.terkumpul;
        totKeluar += s.pengeluaran;

      return `

              <p class="text-sm text-slate-500 mt-0.5">Pengelolaan patungan perpisahan, kado, acara (mendukung multi-tarif & peserta eksternal)</p>
            </div>
            ${
              admin
                ? `
                <button onclick="openPatunganModal()" class="inline-flex items-center justify-center gap-1.5 px-4 py-2.5 rounded-xl bg-teal-700 hover:bg-teal-800 text-white text-xs font-semibold shadow-sm transition active:scale-[0.98]">
                  <i data-lucide="plus" class="w-4 h-4"></i>
                  <span>Buat Event Patungan</span>
                </button>
              `
                : ''
            }
          </div>

          <!-- Filter & Rekap Patungan -->
          <div class="glass-card rounded-2xl p-4 flex flex-col md:flex-row md:items-center justify-between gap-3">
            <div class="flex flex-wrap items-center gap-2">
              <input id="patSearch" aria-label="Cari acara" value="${escapeHtml(State.patSearch)}" oninput="updateSearch(this)" placeholder="Cari nama acara…" class="px-3 py-2 rounded-xl border border-slate-200 text-sm">
              <select onchange="State.patYearFilter=this.value; renderApp();" class="px-3 py-2 rounded-xl border border-slate-200 bg-white text-xs font-bold text-slate-800">
                <option value="Semua" ${State.patYearFilter === 'Semua' ? 'selected' : ''}>Semua Tahun</option>
                ${years.map((y) => `<option value="${y}" ${String(State.patYearFilter) === String(y) ? 'selected' : ''}>Tahun ${y}</option>`).join('')}
              </select>
              ${['Semua', 'Berjalan', 'Selesai']
                .map(
                  (st) => `
                <button onclick="State.patStatusFilter='${st}'; renderApp();" class="px-3 py-1.5 rounded-xl text-xs font-semibold transition ${
                  State.patStatusFilter === st ? 'bg-teal-700 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                }">${st}</button>
              `
                )
                .join('')}
            </div>
            <div class="flex flex-wrap items-center gap-4 text-xs">
              <div><span class="text-slate-500">Terkumpul:</span> <b class="tabular-nums text-emerald-700">${formatRp(totTerkumpul)}</b></div>
              <div><span class="text-slate-500">Belanja:</span> <b class="tabular-nums text-rose-700">${formatRp(totKeluar)}</b></div>
              <div><span class="text-slate-500">Selisih:</span> <b class="tabular-nums ${totTerkumpul - totKeluar >= 0 ? 'text-teal-700' : 'text-rose-700'}">${formatRp(totTerkumpul - totKeluar, true)}</b></div>
            </div>
          </div>

          <!-- Grid Event Cards -->
          ${
            filtered.length === 0
              ? `<div class="glass-card rounded-2xl p-12 text-center text-sm text-slate-400">Tidak ada acara yang cocok dengan filter.</div>`
              : `
              <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
                ${filtered
                  .map((ev) => {
                    const st = computePatunganStats(ev.id);
                    const pct = st.pengeluaran > 0 ? Math.min(100, Math.round((st.terkumpul / st.pengeluaran) * 100)) : 100;
                    const isSurplus = st.selisih >= 0;
                    return `
                      <div onclick="State.activePatunganId='${ev.id}'; renderApp();"
                        class="glass-card rounded-2xl p-5 cursor-pointer hover:border-teal-300 hover:shadow-float transition-all flex flex-col justify-between group">
                        <div>
                          <div class="flex items-start justify-between gap-2 mb-2">
                            <span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold ${
                              ev.status === 'Selesai'
                                ? 'bg-emerald-50 text-emerald-700'
                                : 'bg-amber-50 text-amber-700'
                            }">
                              ${ev.status} • ${ev.tahun}
                            </span>
                            ${
                              ev.terposting_ke_kas
                                ? `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-bold bg-sky-50 text-sky-700"><i data-lucide="check-check" class="w-3 h-3"></i>Terposting</span>`

                          </div>
                          <div class="w-full h-2 rounded-full bg-slate-100 overflow-hidden">
                            <div class="h-full rounded-full ${isSurplus ? 'bg-emerald-500' : 'bg-amber-500'}" style="width:${pct}%"></div>

                          <div class="grid grid-cols-3 gap-2 pt-1 text-[11px]">

                              <div class="font-bold tabular-nums text-emerald-700">${formatRp(st.terkumpul)}</div>
                            </div>
                            <div>
                              <div class="text-slate-400">Pengeluaran</div>
                              <div class="font-bold tabular-nums text-slate-800">${formatRp(st.pengeluaran)}</div>
                            </div>
                            <div class="text-right">
                              <div class="text-slate-400">Selisih</div>
                              <div class="font-extrabold tabular-nums ${isSurplus ? 'text-teal-700' : 'text-rose-700'}">${formatRp(st.selisih, true)}</div>
                            </div>
                          </div>
                        </div>
                      </div>
                    `;
                  })
                  .join('')}
              </div>
            `
          }
        </div>
      `;

    function renderPatunganDetail(eventId) {

        State.activePatunganId = null;
        return renderPatunganPage();

      const admin = isAdmin();
      const st = computePatunganStats(eventId);
      const peserta = State.data.patungan_peserta.filter((p) => p.patungan_id === eventId);
      const isSurplus = st.selisih >= 0;

      return `
        <div class="space-y-5 animate-fade-up">
          <!-- Back & Actions -->
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div class="flex items-center gap-3">

    function eventMembers(year) {
      return State.data.anggota.filter(m=>membershipForYear(m,year)==='Aktif');

    function renderEventPicker() {

      if (!picker) return;
      const checked=new Set(Array.from(picker.querySelectorAll('input:checked'),input=>input.value));
      const year=Number(document.getElementById('pe-tahun').value);
      const members=eventMembers(year);
      picker.innerHTML=members.map(m=>`<label class="flex items-center gap-2 p-2 text-sm"><input type="checkbox" value="${escapeHtml(m.id)}" ${checked.has(m.id)?'checked':''}>${escapeHtml(m.nama)}</label>`).join('') || '<p class="p-2 text-sm">Tidak ada anggota aktif pada tahun ini.</p>';
      updateEventCount();
    }

    function updateEventCount() {
      document.getElementById('event-count').textContent=document.querySelectorAll('#event-members input:checked').length+' peserta dipilih';
    }

    function selectEventMembers(selected) {
      document.querySelectorAll('#event-members input').forEach(input=>{input.checked=selected;});
      updateEventCount();
    }

    async function savePatunganEvent(e, editId) {
      e.preventDefault();
      if (!isAdmin()) return;
      const form=e.currentTarget;
      const submit=form.querySelector('[type="submit"]');
      if (submit.disabled) return;
      submit.disabled=true;
      const payload = {
        nama_event: document.getElementById('pe-nama').value.trim(),
        tahun: Number(document.getElementById('pe-tahun').value),
        status: document.getElementById('pe-status').value,
        subsidi_kas: document.getElementById('pe-subsidi').value === '' ? null : moneyValue('pe-subsidi'),
        tarif_default: moneyValue('pe-tarif') || 0,
        total_pengeluaran: moneyValue('pe-keluar') || 0,
        catatan_tarif: document.getElementById('pe-catatan').value.trim(),
        keterangan: document.getElementById('pe-ket').value.trim(),
      };
      try {
        if (editId) {
          await DB.updateRow('patungan_event', editId, payload);
          showToast('Event patungan diperbarui.', 'success');
        } else {
          const id=form.dataset.eventId;
          const ids=Array.from(form.querySelectorAll('#event-members input:checked'),input=>input.value);
          if (DB.mode==='supabase') {
            const {error}=await DB.client.rpc('buat_patungan_dengan_anggota',{p_id:id,p_acara:payload,p_anggota:ids});
            if(error) throw error;
          } else {
            const data=DB.getDemoStore();
            if (!data.patungan_event.some(ev=>ev.id===id)) {
              const members=data.anggota.filter(m=>ids.includes(m.id));
              if(members.length!==ids.length) throw Error('Daftar anggota berubah. Periksa pilihan peserta.');
              data.patungan_event.push({...payload,id,terposting_ke_kas:false});
              data.patungan_peserta.push(...members.map(m=>({id:generateUuid(),patungan_id:id,anggota_id:m.id,nama_peserta:m.nama,keterangan:m.peran,tarif_target:payload.tarif_default,nominal_bayar:0,status_bayar:payload.tarif_default?'Belum Bayar':'Lunas'})));
              DB.saveDemoStore(data);
            }
          }
          State.activePatunganId = id;
          showToast('Event patungan berhasil dibuat.', 'success');
        }
        closeModal();
        await refreshData(true);
      } catch (err) {
        submit.disabled=false;
        showToast('Gagal menyimpan event: ' + err.message, 'error');
      }
    }

    function deletePatunganEvent(id) {
      if (!isAdmin()) return;
      openConfirmModal({
        title: 'Hapus Event Patungan?',
        message: 'Seluruh daftar peserta pada event ini akan ikut terhapus.',
        confirmLabel: 'Hapus Event',
        danger: true,
        onConfirm: async () => {
          try {
            await DB.deleteRow('patungan_event', id);
            State.activePatunganId = null;
            showToast('Event patungan dihapus.', 'info');
            await refreshData(true);
          } catch (err) {
            showToast('Gagal menghapus: ' + err.message, 'error');
          }
        },
      });
    }

    async function importActiveMembersToPatungan(eventId) {
      if (!isAdmin()) return;
      const ev = State.data.patungan_event.find((e) => e.id === eventId);
      if (!ev) return;
      const existingIds = new Set(
        State.data.patungan_peserta.filter((p) => p.patungan_id === eventId && p.anggota_id).map((p) => p.anggota_id)
      );
      const toAdd = eventMembers(Number(ev.tahun))
        .filter((a) => !existingIds.has(a.id))
        .map((a) => ({
          patungan_id: eventId,
          anggota_id: a.id,
          nama_peserta: a.nama,
          tarif_target: Number(ev.tarif_default) || 0,
          nominal_bayar: 0,
          status_bayar: 'Belum Bayar',
          keterangan: a.peran,
        }));
      if (toAdd.length === 0) {
        showToast('Semua anggota aktif sudah masuk dalam daftar peserta.', 'info');
        return;
      }
      try {
        await DB.insertRows('patungan_peserta', toAdd);
        showToast(`${toAdd.length} anggota aktif ditambahkan ke patungan.`, 'success');
        await refreshData(true);
      } catch (err) {
        showToast('Gagal menambahkan anggota: ' + err.message, 'error');
      }
    }

    async function savePesertaPatungan(e, eventId, pesertaId) {
      e.preventDefault();
      const anggota_id = document.getElementById('pp-anggota').value || null;
      const nama_peserta = document.getElementById('pp-nama').value.trim();
      const tarif_target = moneyValue('pp-target') || 0;
      const nominal_bayar = moneyValue('pp-bayar') || 0;
      const status_bayar = nominal_bayar >= tarif_target && nominal_bayar > 0 ? 'Lunas' : 'Belum Bayar';
      const keterangan = document.getElementById('pp-ket').value.trim();

      const payload = { patungan_id: eventId, anggota_id, nama_peserta, tarif_target, nominal_bayar, status_bayar, keterangan };
      try {
        if (pesertaId) {
          await DB.updateRow('patungan_peserta', pesertaId, payload);
          showToast('Data peserta diperbarui.', 'success');
        } else {
          await DB.insertRow('patungan_peserta', payload);
          showToast('Peserta ditambahkan.', 'success');
        }
        closeModal();
        await refreshData(true);
      } catch (err) {
        showToast('Gagal menyimpan peserta: ' + err.message, 'error');
      }
    }

    async function togglePesertaLunas(pesertaId) {
      if (!isAdmin()) return;
      const p = State.data.patungan_peserta.find((x) => x.id === pesertaId);
      if (!p) return;
      const willBeLunas = p.status_bayar !== 'Lunas';
      try {
        await DB.updateRow('patungan_peserta', pesertaId, {
          status_bayar: willBeLunas ? 'Lunas' : 'Belum Bayar',
          nominal_bayar: willBeLunas ? Number(p.tarif_target) : 0,
        });
        await refreshData(true);
      } catch (err) {
        showToast('Gagal mengubah status: ' + err.message, 'error');
      }
    }

    function postingPatunganKeKas(eventId) {
      if(!isAdmin())return;
      const ev=State.data.patungan_event.find(e=>e.id===eventId);
      if(!ev||ev.terposting_ke_kas)return;
      const st=computePatunganStats(eventId);
      const subsidy=ev.subsidi_kas??Math.max(0,-st.selisih);
      const surplus=st.selisih+Number(subsidy);
      if(surplus<0)return showToast(`Dana masih kurang ${formatRp(-surplus)}. Periksa subsidi atau setoran peserta.`,'error');
      const today=new Date();
      const defaultDay=Number(ev.tahun)===today.getFullYear()?`${ev.tahun}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`:'';
      openModal(`<form id="post-event" class="p-5 space-y-4"><h3 class="font-bold">Posting ke Buku Kas</h3><p>${escapeHtml(ev.nama_event)}</p><p>Subsidi keluar <b>${formatRp(subsidy)}</b> · Sisa kembali ke kas <b>${formatRp(surplus)}</b></p><label class="block">Tanggal posting <input required id="post-date" type="date" class="border p-2 rounded" value="${defaultDay}" min="${ev.tahun}-01-01" max="${ev.tahun}-12-31"></label><button type="button" onclick="closeModal()">Batal</button> <button class="rounded-xl bg-teal-700 text-white px-3 py-2">Konfirmasi posting</button></form>`);
      document.getElementById('post-event').onsubmit=async e=>{
        e.preventDefault();
        const date=document.getElementById('post-date').value;
        const submit=e.currentTarget.querySelector('button:not([type])');
        submit.disabled=true;
        try {
          if(DB.mode==='supabase'){
            const {error}=await DB.client.rpc('posting_patungan',{p_event:eventId,p_tanggal:date});
            if(error)throw error;
          }else{
            const data=DB.getDemoStore();
            const item=data.patungan_event.find(x=>x.id===eventId);
            if(!item.terposting_ke_kas){
              for(const [nominal,tipe,kategori] of [[subsidy,'keluar','Defisit Patungan'],[surplus,'masuk_lain','Sisa Patungan']]){
                if(nominal>0)data.transaksi_kas.push({id:generateUuid(),tahun:ev.tahun,bulan:Number(date.slice(5,7)),tanggal:date,tipe,kategori,deskripsi:`${kategori} — ${ev.nama_event}`,nominal,patungan_id:eventId});
              }
              Object.assign(item,{terposting_ke_kas:true,status:'Selesai'});DB.saveDemoStore(data);
            }
          }
          closeModal();await refreshData(true);showToast('Posting acara tersimpan.','success');
        }catch(err){submit.disabled=false;showToast(err.message,'error');}
      };
    }

    const auditLabels = {
      anggota:'Master anggota', periode_kas:'Periode dan tarif', iuran_kas:'Iuran',
      saldo_lebih_bayar:'Lebih bayar', transaksi_kas:'Buku Kas', patungan_event:'Acara', patungan_peserta:'Peserta patungan'
    };
    const auditView = { rows:[], loading:false, error:'', older:false, cursors:[null], request:0, filters:{} };
    function resetAuditView() {
      Object.assign(auditView,{rows:[],loading:false,error:'',older:false,cursors:[null],request:auditView.request+1,filters:{}});
    }

    function applyAuditFilters(event) {
      event.preventDefault();
      const form = event.currentTarget;
      const {dari,sampai,pelaku,aksi} = form.elements;
      if (dari.value && sampai.value && dari.value > sampai.value) {
        sampai.setCustomValidity('Tanggal akhir harus sama atau sesudah tanggal awal.');
        sampai.reportValidity();
        sampai.setCustomValidity('');
        return;
      }
      auditView.filters = {dari:dari.value, sampai:sampai.value, pelaku:pelaku.value.trim(), aksi:aksi.value};
      loadAuditPage();
    }

    async function loadAuditPage(direction='latest') {
      if(!isAdmin())return;
      const state=auditView;
      if(direction==='latest'){
        state.loading=false;
        state.rows=[]; state.cursors=[null]; state.older=false;
      }
      if(state.loading)return;
      const cursors=state.cursors.slice();
      if(direction==='older' && state.older)cursors.push(state.rows.at(-1).id);
      if(direction==='newer' && cursors.length>1)cursors.pop();
      const request=++state.request;
      state.loading=true;state.error='';renderApp();
      try{
        let rows=[];
        if(DB.mode==='supabase'){
          const f=state.filters;
          const {data,error}=await DB.client.rpc('cari_log_kas',{p_sebelum:cursors.at(-1),p_dari:f.dari||null,p_sampai:f.sampai||null,p_pelaku:f.pelaku||null,p_aksi:f.aksi||null});
          if(error)throw error;
          rows=data;
        }
        if(request===state.request){
          state.rows=rows.slice(0,50);state.older=rows.length>50;state.cursors=cursors;
        }
      }catch(err){
        if(request===state.request)state.error=err.message||'Gagal memuat log.';
      }finally{
        if(request===state.request){
          state.loading=false;
          if(isAdmin() && State.activePage==='pengaturan' && State.settingsTab==='log')renderApp();
        }
      }
    }

    function renderAuditTab() {
      if(!isAdmin())return '';
      const {rows,loading,error,older,cursors}=auditView;
      const formatValue=(key,value)=>{
        if(value==null)return '—';
        if(['tarif_bulanan','nominal','tarif_default','total_pengeluaran','subsidi_kas','tarif_target','nominal_bayar'].includes(key))return formatRp(value);
        if(typeof value==='boolean')return value?'Ya':'Tidak';
        return escapeHtml(String(value));
      };
      const records=rows.map(row=>{
        const diffs=Object.entries(row.perubahan||{}).map(([key,values])=>{
          const label=escapeHtml(key.replaceAll('_',' '));
          const detail=Array.isArray(values)?values.map(v=>formatValue(key,v)).join(' → '):escapeHtml(String(values));
          return `<li><b>${label}</b> ${detail}</li>`;
        }).join('');
        const aksi={INSERT:'Tambah',UPDATE:'Ubah',DELETE:'Hapus'}[row.aksi]||'Perubahan';
        return `<tr><td class="p-3 whitespace-nowrap">${new Date(row.waktu).toLocaleString('id-ID',{timeZone:'Asia/Jakarta'})}</td><td class="p-3">${escapeHtml(row.aktor)}</td><td class="p-3"><b>${aksi}</b> · ${escapeHtml(auditLabels[row.tabel]||row.tabel)}<br>${escapeHtml(row.objek)}</td><td class="p-3">${diffs?`<details><summary class="cursor-pointer text-teal-700">Lihat perubahan</summary><ul>${diffs}</ul></details>`:'Data diperbarui'}</td></tr>`;
      }).join('');
      let message='';
      if(loading)message='Memuat aktivitas…';
      else if(error)message=error;
      else if(DB.mode==='demo')message='Log database tersedia saat terhubung ke Supabase.';
      else if(!rows.length)message=Object.values(auditView.filters).some(Boolean)?'Tidak ada aktivitas yang cocok dengan filter.':'Belum ada perubahan sejak pencatatan diaktifkan.';
      const f=auditView.filters;
      const field='block w-full mt-1 rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm text-slate-800';
      return `<section class="glass-card rounded-2xl overflow-hidden"><header class="p-4 flex justify-between items-center gap-3"><div><h2 class="font-bold">Log Aktivitas</h2><p class="text-xs text-slate-500">Perubahan data kas · Waktu Indonesia Barat</p></div><button class="border rounded-xl px-3 py-2 text-xs" onclick="loadAuditPage()">Muat terbaru</button></header>
        <form onsubmit="applyAuditFilters(event)" class="p-4 border-y border-slate-200 bg-slate-50 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 text-xs font-semibold text-slate-600">
          <label>Dari tanggal (WIB)<input type="date" name="dari" class="${field}" value="${escapeHtml(f.dari||'')}"></label>
          <label>Sampai tanggal (WIB)<input type="date" name="sampai" class="${field}" value="${escapeHtml(f.sampai||'')}"></label>
          <label>Pelaku<input type="search" name="pelaku" class="${field}" placeholder="Email atau sebagian nama akun" value="${escapeHtml(f.pelaku||'')}"></label>
          <label>Jenis aktivitas<select name="aksi" class="${field}">${[['','Semua aktivitas'],['INSERT','Tambah'],['UPDATE','Ubah'],['DELETE','Hapus']].map(([v,label])=>`<option value="${v}" ${v===f.aksi?'selected':''}>${label}</option>`).join('')}</select></label>
          <div class="flex gap-3 sm:col-span-2"><button class="rounded-xl bg-teal-700 px-3 py-2 text-white">Terapkan filter</button><button type="button" onclick="auditView.filters={};loadAuditPage()" class="px-3 py-2">Reset filter</button></div>
        </form>
        ${message?`<p class="p-4 text-sm" role="status">${escapeHtml(message)}</p>`:`<div class="overflow-x-auto"><table class="w-full min-w-[640px] text-left text-sm"><thead class="bg-teal-50"><tr>${['Waktu (WIB)','Pelaku','Aktivitas','Detail'].map(x=>`<th class="p-3">${x}</th>`).join('')}</tr></thead><tbody class="divide-y">${records}</tbody></table></div>`}
        ${!loading && !error && (older||cursors.length>1)?`<footer class="flex justify-between p-4 text-sm"><button ${cursors.length===1?'disabled':''} onclick="loadAuditPage('newer')">Lebih baru</button><button ${!older?'disabled':''} onclick="loadAuditPage('older')">Lebih lama</button></footer>`:''}</section>`;
    }

              class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm" />
          </div>
          <div class="flex justify-end gap-2 pt-3 border-t border-slate-200">
            <button type="button" onclick="closeModal()" class="px-4 py-2.5 rounded-xl text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200">Batal</button>
            <button type="submit" class="px-4 py-2.5 rounded-xl text-xs font-semibold text-white bg-teal-700 hover:bg-teal-800 shadow-sm">Simpan Anggota</button>
          </div>
        </form>
      `, 'max-w-md');
    }

    async function saveMember(e, editId) {
      e.preventDefault();
      const payload = {
        nama: document.getElementById('mem-nama').value.trim(),
        peran: document.getElementById('mem-peran').value,
        username: document.getElementById('mem-user').value.trim().toLowerCase(),
        password: document.getElementById('mem-pass').value.trim(),
        status: document.getElementById('mem-status').value,
        aktif_sejak: document.getElementById('mem-sejak').value.trim(),
        catatan_status: document.getElementById('mem-catatan').value.trim(),
      };
      try {
        if (editId) {
          await DB.updateRow('anggota', editId, payload);
          showToast('Data anggota diperbarui.', 'success');
        } else {
          await DB.insertRow('anggota', payload);
          showToast('Anggota baru ditambahkan.', 'success');
        }
        closeModal();
        await refreshData(true);
      } catch (err) {
        showToast('Gagal menyimpan anggota: ' + err.message, 'error');
      }
    }

    function deleteMember(id) {
      openConfirmModal({
        title: 'Hapus Anggota Ini?',
        message: 'Jika anggota resign/mutasi, disarankan ubah status menjadi "Resign/Mutasi" agar riwayat iuran historis tetap tersimpan. Yakin ingin menghapus permanen?',
        confirmLabel: 'Hapus Permanen',
        danger: true,
        onConfirm: async () => {
          try {
            await DB.deleteRow('anggota', id);
            showToast('Anggota dihapus.', 'info');
            await refreshData(true);
          } catch (err) {
            showToast('Gagal menghapus: ' + err.message, 'error');
          }
        },
      });
    }

    function periodHasData(data,year) {
      return ['iuran_kas','saldo_lebih_bayar','transaksi_kas','patungan_event'].some(table=>data[table].some(r=>Number(r.tahun)===Number(year)));
    }

    function deleteEmptyPeriod(id) {
      if(!isAdmin())return;
      const period=State.data.periode_kas.find(p=>p.id===id);
      if(!period)return;
      if(periodHasData(State.data,period.tahun))return showToast('Periode ini masih memiliki data.','error');
      openConfirmModal({title:`Hapus periode ${period.tahun}?`,message:'Periode beserta tarif akan dihapus jika masih kosong.',confirmLabel:'Hapus periode kosong',danger:true,onConfirm:async()=>{
        try{
          if(DB.mode==='demo' && periodHasData(DB.getDemoStore(),period.tahun))throw Error('Periode sudah memiliki data.');
          await DB.deleteRow('periode_kas',id);await refreshData(true);showToast('Periode kosong dihapus.','success');
        }catch(err){showToast(err.code==='23503'?'Periode sudah berisi data dan dilindungi.':err.message,'error');}
      }});
    }

    function renderTabPeriode() {
      const list = [...State.data.periode_kas].sort((a, b) => Number(b.tahun) - Number(a.tahun));
      return `
        <div class="glass-card rounded-2xl overflow-hidden">
          <div class="p-4 sm:p-5 border-b border-slate-200/80 flex items-center justify-between gap-3">
            <div>
              <h2 class="text-base font-bold text-slate-900">Periode & Tarif Iuran Bulanan</h2>
              <p class="text-xs text-slate-500 mt-0.5">Tambahkan tahun buku baru beserta besaran iuran per bulan</p>
            </div>
            <button onclick="openPeriodeModal()" class="inline-flex items-center gap-1.5 px-4 py-2 rounded-xl bg-teal-700 hover:bg-teal-800 text-white text-xs font-semibold shadow-sm">
              <i data-lucide="plus" class="w-4 h-4"></i>
              <span>Tambah Tahun</span>
            </button>
          </div>
          <div class="divide-y divide-slate-200/70">
            ${list
              .map(
                (p) => `
              <div class="p-4 sm:px-5 flex items-center justify-between gap-4 hover:bg-slate-50/70 transition">
                <div>
                  <div class="flex items-center gap-2.5">
                    <span class="text-base font-extrabold text-slate-900">Tahun ${p.tahun}</span>
                    <span class="px-2.5 py-0.5 rounded-full bg-teal-50 text-teal-700 text-xs font-bold tabular-nums">${formatRp(p.tarif_bulanan)} / bulan</span>
                  </div>
                  <div class="text-xs text-slate-500 mt-1">${escapeHtml(p.keterangan || '—')}</div>
                </div>
                <div class="flex flex-wrap gap-2"><button onclick="openPeriodeModal('${p.id}')" class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-xs font-semibold text-slate-700">
                  Edit Tarif
                </button><button ${periodHasData(State.data,p.tahun)?'disabled title="Tahun sudah berisi data"':''} onclick="deleteEmptyPeriod('${p.id}')" class="text-xs rounded-xl px-3 py-2 text-rose-700 bg-rose-50 disabled:opacity-50">${periodHasData(State.data,p.tahun)?'Terisi · terkunci':'Hapus periode'}</button></div>
              </div>
            `
              )
              .join('')}
          </div>
        </div>
      `;
    }

    function openPeriodeModal(editId = null) {
      const p = editId ? State.data.periode_kas.find((x) => x.id === editId) : null;
      const nextYear = Math.max(2026, ...getAvailableYears()) + 1;
      openModal(`
        <div class="p-5 border-b border-slate-200 flex items-center justify-between">
          <h3 class="text-base font-bold text-slate-900">${p ? `Edit Tarif Tahun ${p.tahun}` : 'Tambah Periode Tahun Baru'}</h3>
          <button onclick="closeModal()" class="p-1.5 rounded-xl text-slate-400 hover:bg-slate-100"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        <form onsubmit="savePeriode(event, '${editId || ''}')" class="p-5 space-y-4">
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Tahun</label>
              <input id="per-tahun" type="number" required ${p ? 'readonly' : ''} value="${p ? p.tahun : nextYear}"
                class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm font-bold tabular-nums ${p ? 'bg-slate-50 text-slate-500' : ''}" />
            </div>
            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Tarif Bulanan (Rp)</label>
              <input id="per-tarif" type="text" inputmode="numeric" data-money data-min="0" required value="${p ? p.tarif_bulanan : 20000}"
                class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm font-bold tabular-nums" />
            </div>
          </div>
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Keterangan</label>
            <input id="per-ket" type="text" value="${escapeHtml(p?.keterangan || '')}" placeholder="Contoh: Kesepakatan rapat ruangan"
              class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm" />
          </div>
          <div class="flex justify-end gap-2 pt-3 border-t border-slate-200">
            <button type="button" onclick="closeModal()" class="px-4 py-2.5 rounded-xl text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200">Batal</button>
            <button type="submit" class="px-4 py-2.5 rounded-xl text-xs font-semibold text-white bg-teal-700 hover:bg-teal-800 shadow-sm">Simpan</button>
          </div>
        </form>
      `, 'max-w-md');
    }

    async function savePeriode(e, editId) {
      e.preventDefault();
      const payload = {
        tahun: Number(document.getElementById('per-tahun').value),
        tarif_bulanan: moneyValue('per-tarif') || 0,
        keterangan: document.getElementById('per-ket').value.trim(),
      };
      try {
        if (editId) {
          await DB.updateRow('periode_kas', editId, { tarif_bulanan: payload.tarif_bulanan, keterangan: payload.keterangan });
          showToast('Tarif periode diperbarui.', 'success');
        } else {
          await DB.insertRow('periode_kas', payload);
          showToast(`Periode tahun ${payload.tahun} ditambahkan.`, 'success');
        }
        closeModal();
        await refreshData(true);
      } catch (err) {
        showToast('Gagal menyimpan periode: ' + err.message, 'error');
      }
    }

    function renderTabSupabase() {
      if (State.session?.role !== 'it_support') return '';
      return `<section class="glass-card rounded-2xl p-5 space-y-4">
        <h2 class="font-bold">Sistem &amp; Backup</h2>
        <p>Lingkungan: ${DB.mode === 'demo' ? 'DEMO' : isProduction ? 'PROD' : 'DEV'}</p>
        <button class="btn px-3 py-2 border rounded-xl" onclick="exportBackupJson()">Unduh backup JSON</button>
        <button class="btn px-3 py-2 border rounded-xl" onclick="copyTextToClipboard(SUPABASE_SQL_SCRIPT, 'SQL disalin')">Salin skrip SQL</button>
      </section>`;
    }

    function exportBackupJson() {
      if (State.session?.role !== 'it_support') return;
      const blob = new Blob([JSON.stringify(State.data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Backup_KAS_IPD32_${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('File backup JSON berhasil diunduh.', 'success');
    }

    // Tutup modal dengan tombol Escape
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    // Jalankan aplikasi saat DOM siap
    window.addEventListener('DOMContentLoaded', bootstrap);
  </script>
</body>
</html>

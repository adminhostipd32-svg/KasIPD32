    async function saveTransaksi(e, editId) {
      e.preventDefault();
      const tipe = document.getElementById('tx-tipe').value;
      const tanggal = document.getElementById('tx-tanggal').value;
      const kategori = document.getElementById('tx-kategori').value;
      const nominal = moneyValue('tx-nominal') || 0;
      const deskripsi = document.getElementById('tx-deskripsi').value.trim();
      const dt = new Date(tanggal + 'T00:00:00');
      const tahun = dt.getFullYear();
      const bulan = dt.getMonth() + 1;

      const payload = { tahun, bulan, tanggal, tipe, kategori, deskripsi, nominal };
      try {
        if (editId) {
          await DB.updateRow('transaksi_kas', editId, payload);
          showToast('Transaksi berhasil diperbarui.', 'success');
        } else {
          await DB.insertRow('transaksi_kas', { ...payload, patungan_id: null });
          showToast('Transaksi baru tercatat.', 'success');
        }
        closeModal();
        await refreshData(true);
      } catch (err) {
        showToast('Gagal menyimpan transaksi: ' + err.message, 'error');
      }
    }

    function deleteTransaksi(id) {
      if (!isAdmin()) return;
      openConfirmModal({
        title: 'Hapus Transaksi Ini?',
        message: 'Data transaksi akan dihapus permanen dan saldo kas kumulatif akan dihitung ulang otomatis.',
        confirmLabel: 'Hapus Permanen',
        danger: true,
        onConfirm: async () => {
          try {
            await DB.deleteRow('transaksi_kas', id);
            showToast('Transaksi dihapus.', 'info');
            await refreshData(true);
          } catch (err) {
            showToast('Gagal menghapus: ' + err.message, 'error');
          }
        },
      });
    }

    /* ============================================================================
       6. PAGE: PATUNGAN & ACARA (LIST + DETAIL PESERTA + POSTING KE KAS)
    ============================================================================ */
    function subsidyLabel(ev,stats) {
      return ev.subsidi_kas==null ? `${formatRp(Math.max(0,-stats.selisih))} (otomatis)` : formatRp(ev.subsidi_kas);
    }

    function renderPatunganPage() {
      if (State.activePatunganId) {
        return renderPatunganDetail(State.activePatunganId);
      }

      const admin = isAdmin();
      const years = [...new Set(State.data.patungan_event.map((p) => Number(p.tahun)))].sort((a, b) => b - a);
      const filtered = State.data.patungan_event.filter((ev) => {
        if (!ev.nama_event.toLowerCase().includes(State.patSearch.trim().toLowerCase())) return false;
        if (State.patYearFilter !== 'Semua' && String(ev.tahun) !== String(State.patYearFilter)) return false;
        if (State.patStatusFilter !== 'Semua' && ev.status !== State.patStatusFilter) return false;
        return true;
      });

      let totTerkumpul = 0, totKeluar = 0;
      filtered.forEach((ev) => {
        const s = computePatunganStats(ev.id);
        totTerkumpul += s.terkumpul;
        totKeluar += s.pengeluaran;
      });

      return `
        <div class="space-y-5 animate-fade-up">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div>
              <h1 class="text-2xl font-extrabold tracking-tight text-slate-900">Patungan & Acara Ruangan</h1>
              <p class="text-sm text-slate-500 mt-0.5">Pengelolaan patungan perpisahan, kado, acara (mendukung multi-tarif & peserta eksternal)</p>
            </div>
            ${
              admin
                ? `
                <button onclick="openPatunganModal()" class="inline-flex items-center justify-center gap-1.5 px-4 py-2.5 rounded-xl bg-teal-700 hover:bg-teal-800 text-white text-xs font-semibold shadow-sm transition active:scale-[0.98]">
                  <i data-lucide="plus" class="w-4 h-4"></i>
                  <span>Buat Event Patungan</span>
                </button>
              `
                : ''
            }
          </div>

          <!-- Filter & Rekap Patungan -->
          <div class="glass-card rounded-2xl p-4 flex flex-col md:flex-row md:items-center justify-between gap-3">
            <div class="flex flex-wrap items-center gap-2">
              <input id="patSearch" aria-label="Cari acara" value="${escapeHtml(State.patSearch)}" oninput="updateSearch(this)" placeholder="Cari nama acara…" class="px-3 py-2 rounded-xl border border-slate-200 text-sm">
              <select onchange="State.patYearFilter=this.value; renderApp();" class="px-3 py-2 rounded-xl border border-slate-200 bg-white text-xs font-bold text-slate-800">
                <option value="Semua" ${State.patYearFilter === 'Semua' ? 'selected' : ''}>Semua Tahun</option>
                ${years.map((y) => `<option value="${y}" ${String(State.patYearFilter) === String(y) ? 'selected' : ''}>Tahun ${y}</option>`).join('')}
              </select>
              ${['Semua', 'Berjalan', 'Selesai']
                .map(
                  (st) => `
                <button onclick="State.patStatusFilter='${st}'; renderApp();" class="px-3 py-1.5 rounded-xl text-xs font-semibold transition ${
                  State.patStatusFilter === st ? 'bg-teal-700 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                }">${st}</button>
              `
                )
                .join('')}
            </div>
            <div class="flex flex-wrap items-center gap-4 text-xs">
              <div><span class="text-slate-500">Terkumpul:</span> <b class="tabular-nums text-emerald-700">${formatRp(totTerkumpul)}</b></div>
              <div><span class="text-slate-500">Belanja:</span> <b class="tabular-nums text-rose-700">${formatRp(totKeluar)}</b></div>
              <div><span class="text-slate-500">Selisih:</span> <b class="tabular-nums ${totTerkumpul - totKeluar >= 0 ? 'text-teal-700' : 'text-rose-700'}">${formatRp(totTerkumpul - totKeluar, true)}</b></div>
            </div>
          </div>

          <!-- Grid Event Cards -->
          ${
            filtered.length === 0
              ? `<div class="glass-card rounded-2xl p-12 text-center text-sm text-slate-400">Tidak ada acara yang cocok dengan filter.</div>`
              : `
              <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
                ${filtered
                  .map((ev) => {
                    const st = computePatunganStats(ev.id);
                    const pct = st.pengeluaran > 0 ? Math.min(100, Math.round((st.terkumpul / st.pengeluaran) * 100)) : 100;
                    const isSurplus = st.selisih >= 0;
                    return `
                      <div onclick="State.participantSearch=''; State.activePatunganId='${ev.id}'; renderApp();"
                        class="glass-card rounded-2xl p-5 cursor-pointer hover:border-teal-300 hover:shadow-float transition-all flex flex-col justify-between group">
                        <div>
                          <div class="flex items-start justify-between gap-2 mb-2">
                            <span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold ${
                              ev.status === 'Selesai'
                                ? 'bg-emerald-50 text-emerald-700'
                                : 'bg-amber-50 text-amber-700'
                            }">
                              ${ev.status} • ${ev.tahun}
                            </span>
                            ${
                              ev.terposting_ke_kas
                                ? `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-bold bg-sky-50 text-sky-700"><i data-lucide="check-check" class="w-3 h-3"></i>Terposting</span>`
                                : `<span class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-slate-100 text-slate-500">Belum Posting</span>`
                            }
                          </div>
                          <h3 class="text-base font-bold text-slate-900 group-hover:text-teal-700 transition">${escapeHtml(ev.nama_event)}</h3>
                          <p class="text-xs text-slate-500 mt-1 line-clamp-2">${escapeHtml(ev.catatan_tarif || `Tarif default ${formatRp(ev.tarif_default)}`)}</p>
                        </div>

                        <div class="mt-4 pt-4 border-t border-slate-200/70 space-y-2.5"><p class="text-xs text-slate-500">Subsidi kas <b>${subsidyLabel(ev,st)}</b></p>
                          <div class="flex items-center justify-between text-xs">
                            <span class="text-slate-500 font-medium">${st.lunasCount}/${st.totalPeserta} peserta lunas</span>
                            <span class="font-bold tabular-nums text-slate-800">${pct}%</span>
                          </div>
                          <div class="w-full h-2 rounded-full bg-slate-100 overflow-hidden">
                            <div class="h-full rounded-full ${isSurplus ? 'bg-emerald-500' : 'bg-amber-500'}" style="width:${pct}%"></div>
                          </div>
                          <div class="grid grid-cols-3 gap-2 pt-1 text-[11px]">
                            <div>
                              <div class="text-slate-400">Terkumpul</div>
                              <div class="font-bold tabular-nums text-emerald-700">${formatRp(st.terkumpul)}</div>
                            </div>
                            <div>
                              <div class="text-slate-400">Pengeluaran</div>
                              <div class="font-bold tabular-nums text-slate-800">${formatRp(st.pengeluaran)}</div>
                            </div>
                            <div class="text-right">
                              <div class="text-slate-400">Selisih</div>
                              <div class="font-extrabold tabular-nums ${isSurplus ? 'text-teal-700' : 'text-rose-700'}">${formatRp(st.selisih, true)}</div>
                            </div>
                          </div>
                        </div>
                      </div>
                    `;
                  })
                  .join('')}
              </div>
            `
          }
        </div>
      `;
    }

    function renderPatunganDetail(eventId) {
      const ev = State.data.patungan_event.find((e) => e.id === eventId);
      if (!ev) {
        State.activePatunganId = null;
        return renderPatunganPage();
      }
      const admin = isAdmin();
      const st = computePatunganStats(eventId);
      const peserta = State.data.patungan_peserta.filter((p) => p.patungan_id === eventId);
      const query = State.participantSearch.trim().toLowerCase();
      const matches = peserta.filter(p => (p.nama_peserta || '').toLowerCase().includes(query));
      const isSurplus = st.selisih >= 0;

      return `
        <div class="space-y-5 animate-fade-up">
          <!-- Back & Actions -->
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div class="flex items-center gap-3">
              <button onclick="State.activePatunganId=null; renderApp();" class="p-2.5 rounded-xl bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 transition">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
              </button>
              <div>
                <div class="flex items-center gap-2 flex-wrap">
                  <h1 class="text-xl sm:text-2xl font-extrabold text-slate-900">${escapeHtml(ev.nama_event)}</h1>
                  <span class="px-2.5 py-0.5 rounded-full text-xs font-bold ${ev.status === 'Selesai' ? 'bg-emerald-50 text-emerald-700' : 'bg-amber-50 text-amber-700'}">${ev.status}</span>
                </div>
                <p class="text-xs text-slate-500 mt-0.5">${escapeHtml(ev.catatan_tarif || '')} ${ev.keterangan ? '• ' + escapeHtml(ev.keterangan) : ''}</p>
              </div>
            </div>
            ${
              admin
                ? `
                <div class="flex flex-wrap items-center gap-2">
                  <button onclick="openPatunganModal('${ev.id}')" class="px-3.5 py-2 rounded-xl bg-white border border-slate-200 text-xs font-semibold text-slate-700 hover:bg-slate-50">
                    Edit Event
                  </button>
                  ${
                    !ev.terposting_ke_kas
                      ? `
                      <button onclick="postingPatunganKeKas('${ev.id}')" class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-sky-600 hover:bg-sky-700 text-white text-xs font-semibold shadow-sm transition">
                        <i data-lucide="send" class="w-3.5 h-3.5"></i>
                        <span>Posting Selisih ke Kas</span>
                      </button>
                    `
                      : `
                      <span class="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl bg-sky-50 text-sky-700 text-xs font-bold border border-sky-200">
                        <i data-lucide="check-circle-2" class="w-3.5 h-3.5"></i>Sudah Diposting ke Kas
                      </span>
                    `
                  }
                  <button onclick="deletePatunganEvent('${ev.id}')" class="p-2 rounded-xl bg-rose-50 text-rose-700 hover:bg-rose-100" title="Hapus Event">
                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                  </button>
                </div>
              `
                : ''
            }
          </div>

          <div class="glass-card rounded-2xl p-4"><div class="text-xs font-semibold text-slate-500">Subsidi kas</div><strong>${subsidyLabel(ev,st)}</strong><div class="text-xs text-slate-500">Saldo acara setelah subsidi: ${formatRp(st.selisih + Number(ev.subsidi_kas ?? Math.max(0,-st.selisih)))}</div></div>
          <!-- 4 Ringkasan Event -->
          <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
            <div class="glass-card rounded-2xl p-4">
              <div class="text-[11px] font-bold uppercase text-slate-500">Terkumpul</div>
              <div class="text-xl font-extrabold tabular-nums text-emerald-700 mt-1">${formatRp(st.terkumpul)}</div>
              <div class="text-xs text-slate-500 mt-0.5">${st.lunasCount} dari ${st.totalPeserta} peserta lunas</div>
            </div>
            <div class="glass-card rounded-2xl p-4">
              <div class="text-[11px] font-bold uppercase text-slate-500">Total Pengeluaran</div>
              <div class="text-xl font-extrabold tabular-nums text-slate-900 mt-1">${formatRp(st.pengeluaran)}</div>
              <div class="text-xs text-slate-500 mt-0.5">Harga kado / konsumsi acara</div>
            </div>
            <div class="glass-card rounded-2xl p-4">
              <div class="text-[11px] font-bold uppercase text-slate-500">Selisih sebelum subsidi</div>
              <div class="text-xl font-extrabold tabular-nums ${isSurplus ? 'text-teal-700' : 'text-rose-700'} mt-1">${formatRp(st.selisih, true)}</div>
              <div class="text-xs text-slate-500 mt-0.5">Dana peserta dikurangi pengeluaran</div>
            </div>
            <div class="glass-card rounded-2xl p-4">
              <div class="text-[11px] font-bold uppercase text-slate-500">Tarif Default</div>
              <div class="text-xl font-extrabold tabular-nums text-sky-700 mt-1">${formatRp(ev.tarif_default)}</div>
              <div class="text-xs text-slate-500 mt-0.5">Bisa beda per peserta/peran</div>
            </div>
          </div>

          <!-- Daftar Peserta -->
          <div class="glass-card rounded-2xl overflow-hidden">
            <div class="p-4 sm:p-5 border-b border-slate-200/80 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <div>
                <h2 class="text-base font-bold text-slate-900">Daftar Peserta Patungan (${peserta.length})</h2>
                <p class="text-xs text-slate-500 mt-0.5">Mendukung anggota internal IPD 32 maupun peserta eksternal (dokter / ruangan lain)</p>
              </div>
              ${
                admin
                  ? `
                  <div class="flex flex-wrap items-center gap-2">
                    <button onclick="importActiveMembersToPatungan('${ev.id}')" class="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold transition">
                      <i data-lucide="users" class="w-3.5 h-3.5"></i>
                      <span>+ Semua Anggota Aktif</span>
                    </button>
                    <button onclick="openPesertaModal('${ev.id}')" class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-teal-700 hover:bg-teal-800 text-white text-xs font-semibold shadow-sm transition">
                      <i data-lucide="user-plus" class="w-3.5 h-3.5"></i>
                      <span>Tambah Peserta</span>
                    </button>
                  </div>
                `
                  : ''
              }
            </div>
            <div class="px-4 py-3 flex flex-wrap items-center gap-3">
              <input type="search" id="participantSearch" aria-label="Cari nama peserta" placeholder="Cari nama peserta..." value="${escapeHtml(State.participantSearch)}" oninput="updateSearch(this)" class="w-full sm:w-72 px-3 py-2 rounded-xl border border-slate-200 text-sm">
              ${query ? `<span class="text-xs text-slate-600" role="status">${matches.length} dari ${peserta.length} peserta</span>` : ''}
            </div>
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse min-w-[620px]">
                <thead>
                  <tr class="bg-slate-50/90 border-b border-slate-200 text-[11px] font-bold uppercase tracking-wider text-slate-500">
                    <th class="py-3 px-4 w-12">No</th>
                    <th class="py-3 px-4">Nama Peserta</th>
                    <th class="py-3 px-4 text-right">Tarif Target</th>
                    <th class="py-3 px-4 text-right">Nominal Bayar</th>
                    <th class="py-3 px-4 text-center">Status</th>
                    ${admin ? `<th class="py-3 px-4 text-right w-28">Aksi</th>` : ''}
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-200/70 text-sm">
                  ${
                    matches.length === 0
                      ? `<tr><td colspan="${admin ? 6 : 5}" class="py-10 text-center text-slate-400">${peserta.length ? 'Tidak ada nama peserta yang cocok.' : 'Belum ada peserta terdaftar pada event ini.'}</td></tr>`
                      : matches
                          .map((p, idx) => {
                            const lunas = p.status_bayar === 'Lunas';
                            return `
                              <tr class="hover:bg-slate-50/70 transition">
                                <td class="py-3 px-4 text-xs font-semibold text-slate-400 tabular-nums">${idx + 1}</td>
                                <td class="py-3 px-4">
                                  <div class="font-bold text-slate-900 flex items-center gap-2">
                                    <span>${escapeHtml(p.nama_peserta)}</span>
                                    ${!p.anggota_id ? `<span class="px-1.5 py-0.5 rounded bg-sky-50 text-sky-700 text-[10px] font-bold">Eksternal</span>` : ''}
                                  </div>
                                  ${p.keterangan ? `<div class="text-xs text-slate-500">${escapeHtml(p.keterangan)}</div>` : ''}
                                </td>
                                <td class="py-3 px-4 text-right tabular-nums text-slate-600">${formatRp(p.tarif_target)}</td>
                                <td class="py-3 px-4 text-right tabular-nums font-bold ${lunas ? 'text-emerald-700' : 'text-slate-400'}">${formatRp(p.nominal_bayar)}</td>
                                <td class="py-3 px-4 text-center">
                                  ${
                                    admin
                                      ? `
                                      <button onclick="togglePesertaLunas('${p.id}')" class="px-3 py-1 rounded-full text-xs font-bold transition active:scale-95 ${
                                        lunas
                                          ? 'bg-emerald-50 text-emerald-700 border border-emerald-200 hover:bg-emerald-100'
                                          : 'bg-amber-50 text-amber-700 border border-amber-200 hover:bg-amber-100'
                                      }">
                                        ${lunas ? '✓ Lunas' : 'Belum Bayar'}
                                      </button>
                                    `
                                      : `<span class="px-3 py-1 rounded-full text-xs font-bold ${lunas ? 'bg-emerald-50 text-emerald-700' : 'bg-amber-50 text-amber-700'}">${p.status_bayar}</span>`
                                  }
                                </td>
                                ${
                                  admin
                                    ? `
                                    <td class="py-3 px-4 text-right whitespace-nowrap">
                                      <button onclick="openPesertaModal('${ev.id}', '${p.id}')" class="p-1.5 rounded-lg text-slate-500 hover:bg-slate-100 hover:text-teal-700"><i data-lucide="pencil" class="w-4 h-4"></i></button>
                                      <button onclick="deletePeserta('${p.id}')" class="p-1.5 rounded-lg text-slate-500 hover:bg-rose-50 hover:text-rose-700"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                                    </td>
                                  `
                                    : ''
                                }
                              </tr>
                            `;
                          })
                          .join('')
                  }
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    function eventMembers(year) {
      return State.data.anggota.filter(m=>membershipForYear(m,year)==='Aktif');
    }

    function renderEventPicker() {
      const picker=document.getElementById('event-members');
      if (!picker) return;
      const checked=new Set(Array.from(picker.querySelectorAll('input:checked'),input=>input.value));
      const year=Number(document.getElementById('pe-tahun').value);
      const members=eventMembers(year);
      picker.innerHTML=members.map(m=>`<label class="flex items-center gap-2 p-2 text-sm"><input type="checkbox" value="${escapeHtml(m.id)}" ${checked.has(m.id)?'checked':''}>${escapeHtml(m.nama)}</label>`).join('') || '<p class="p-2 text-sm">Tidak ada anggota aktif pada tahun ini.</p>';
      updateEventCount();
    }

    function updateEventCount() {
      document.getElementById('event-count').textContent=document.querySelectorAll('#event-members input:checked').length+' peserta dipilih';
    }

    function selectEventMembers(selected) {
      document.querySelectorAll('#event-members input').forEach(input=>{input.checked=selected;});
      updateEventCount();
    }

    function openPatunganModal(editId = null) {
      if (!isAdmin()) return;
      const ev = editId ? State.data.patungan_event.find((e) => e.id === editId) : null;
      openModal(`
        <div class="p-5 border-b border-slate-200 flex items-center justify-between">
          <h3 class="text-base font-bold text-slate-900">${ev ? 'Edit Event Patungan' : 'Buat Event Patungan Baru'}</h3>
          <button onclick="closeModal()" class="p-1.5 rounded-xl text-slate-400 hover:bg-slate-100"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        <form data-event-id="${ev?.id || generateUuid()}" onsubmit="savePatunganEvent(event, '${editId || ''}')" class="p-5 space-y-4 overflow-y-auto">
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Nama Event / Acara</label>
            <input id="pe-nama" type="text" required value="${escapeHtml(ev?.nama_event || '')}" placeholder="Contoh: Perpisahan Ns. Budi"
              class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm" />
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Tahun</label>
              <input id="pe-tahun" type="number" onchange="renderEventPicker()" required value="${ev?.tahun || State.selectedYear}"
                class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm font-bold tabular-nums" />
            </div>
            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Status</label>
              <select id="pe-status" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm font-semibold">
                <option value="Berjalan" ${ev?.status === 'Berjalan' ? 'selected' : ''}>Berjalan</option>
                <option value="Selesai" ${ev?.status === 'Selesai' ? 'selected' : ''}>Selesai</option>
              </select>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>

    async function savePatunganEvent(e, editId) {
      e.preventDefault();
      if (!isAdmin()) return;
      const form=e.currentTarget;
      const submit=form.querySelector('[type="submit"]');
      if (submit.disabled) return;
      submit.disabled=true;
      const payload = {
        nama_event: document.getElementById('pe-nama').value.trim(),
        tahun: Number(document.getElementById('pe-tahun').value),
        status: document.getElementById('pe-status').value,
        subsidi_kas: document.getElementById('pe-subsidi').value === '' ? null : moneyValue('pe-subsidi'),
        tarif_default: moneyValue('pe-tarif') || 0,
        total_pengeluaran: moneyValue('pe-keluar') || 0,
        catatan_tarif: document.getElementById('pe-catatan').value.trim(),
        keterangan: document.getElementById('pe-ket').value.trim(),
      };
      try {
        if (editId) {
          await DB.updateRow('patungan_event', editId, payload);
          showToast('Event patungan diperbarui.', 'success');
        } else {
          const id=form.dataset.eventId;
          const ids=Array.from(form.querySelectorAll('#event-members input:checked'),input=>input.value);
          const {error}=await DB.client.rpc('buat_patungan_dengan_anggota',{p_id:id,p_acara:payload,p_anggota:ids});
          if(error) throw error;
          State.participantSearch = '';
          State.activePatunganId = id;
          showToast('Event patungan berhasil dibuat.', 'success');
        }
        closeModal();
        await refreshData(true);
      } catch (err) {
        submit.disabled=false;
        showToast('Gagal menyimpan event: ' + err.message, 'error');
      }
    }

        State.data.patungan_peserta.filter((p) => p.patungan_id === eventId && p.anggota_id).map((p) => p.anggota_id)

      const toAdd = eventMembers(Number(ev.tahun))

    function postingPatunganKeKas(eventId) {
      if(!isAdmin())return;
      const ev=State.data.patungan_event.find(e=>e.id===eventId);
      if(!ev||ev.terposting_ke_kas)return;
      const st=computePatunganStats(eventId);
      const subsidy=ev.subsidi_kas??Math.max(0,-st.selisih);
      const surplus=st.selisih+Number(subsidy);
      if(surplus<0)return showToast(`Dana masih kurang ${formatRp(-surplus)}. Periksa subsidi atau setoran peserta.`,'error');
      const today=new Date();
      const defaultDay=Number(ev.tahun)===today.getFullYear()?`${ev.tahun}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`:'';
      openModal(`<form id="post-event" class="p-5 space-y-4"><h3 class="font-bold">Posting ke Buku Kas</h3><p>${escapeHtml(ev.nama_event)}</p><p>Subsidi keluar <b>${formatRp(subsidy)}</b> · Sisa kembali ke kas <b>${formatRp(surplus)}</b></p><label class="block">Tanggal posting <input required id="post-date" type="date" class="border p-2 rounded" value="${defaultDay}" min="${ev.tahun}-01-01" max="${ev.tahun}-12-31"></label><button type="button" onclick="closeModal()">Batal</button> <button class="rounded-xl bg-teal-700 text-white px-3 py-2">Konfirmasi posting</button></form>`);
      document.getElementById('post-event').onsubmit=async e=>{
        e.preventDefault();
        const date=document.getElementById('post-date').value;
        const submit=e.currentTarget.querySelector('button:not([type])');
        submit.disabled=true;
        try {
          const {error}=await DB.client.rpc('posting_patungan',{p_event:eventId,p_tanggal:date});
          if(error)throw error;
          closeModal();await refreshData(true);showToast('Posting acara tersimpan.','success');
        }catch(err){submit.disabled=false;showToast(err.message,'error');}
      };
    }

    const auditLabels = {
      anggota:'Master anggota', periode_kas:'Periode dan tarif', iuran_kas:'Iuran',
      saldo_lebih_bayar:'Lebih bayar', transaksi_kas:'Buku Kas', patungan_event:'Acara', patungan_peserta:'Peserta patungan'
    };
    const auditView = { rows:[], loading:false, error:'', older:false, cursors:[null], request:0, filters:{} };
    function resetAuditView() {
      Object.assign(auditView,{rows:[],loading:false,error:'',older:false,cursors:[null],request:auditView.request+1,filters:{}});
    }

    function applyAuditFilters(event) {
      event.preventDefault();
      const form = event.currentTarget;
      const {dari,sampai,pelaku,aksi} = form.elements;
      if (dari.value && sampai.value && dari.value > sampai.value) {
        sampai.setCustomValidity('Tanggal akhir harus sama atau sesudah tanggal awal.');
        sampai.reportValidity();
        sampai.setCustomValidity('');
        return;
      }
      auditView.filters = {dari:dari.value, sampai:sampai.value, pelaku:pelaku.value.trim(), aksi:aksi.value};
      loadAuditPage();
    }

    async function loadAuditPage(direction='latest') {
      if(!staffAccess())return;
      const state=auditView;
      if(direction==='latest'){
        state.loading=false;
        state.rows=[]; state.cursors=[null]; state.older=false;
      }
      if(state.loading)return;
      const cursors=state.cursors.slice();
      if(direction==='older' && state.older)cursors.push(state.rows.at(-1).id);
      if(direction==='newer' && cursors.length>1)cursors.pop();
      const request=++state.request;
      state.loading=true;state.error='';renderApp();
      try{
        let rows=[];
        if(DB.mode==='supabase'){
          const f=state.filters;
          const {data,error}=await DB.client.rpc('cari_log_kas',{p_sebelum:cursors.at(-1),p_dari:f.dari||null,p_sampai:f.sampai||null,p_pelaku:f.pelaku||null,p_aksi:f.aksi||null});
          if(error)throw error;
          rows=data;
        }
        if(request===state.request){
          state.rows=rows.slice(0,50);state.older=rows.length>50;state.cursors=cursors;
        }
      }catch(err){
        if(request===state.request)state.error=err.message||'Gagal memuat log.';
      }finally{
        if(request===state.request){
          state.loading=false;
          if(staffAccess() && State.activePage==='pengaturan' && State.settingsTab==='log')renderApp();
        }
      }
    }

    function renderAuditTab() {
      if(!staffAccess())return '';
      const {rows,loading,error,older,cursors}=auditView;
      const formatValue=(key,value)=>{
        if(value==null)return '—';
        if(['tarif_bulanan','nominal','tarif_default','total_pengeluaran','subsidi_kas','tarif_target','nominal_bayar'].includes(key))return formatRp(value);
        if(typeof value==='boolean')return value?'Ya':'Tidak';
        return escapeHtml(String(value));
      };
      const records=rows.map(row=>{
        const diffs=Object.entries(row.perubahan||{}).map(([key,values])=>{
          const label=escapeHtml(key.replaceAll('_',' '));
          const detail=Array.isArray(values)?values.map(v=>formatValue(key,v)).join(' → '):escapeHtml(String(values));
          return `<li><b>${label}</b> ${detail}</li>`;
        }).join('');
        const aksi={INSERT:'Tambah',UPDATE:'Ubah',DELETE:'Hapus'}[row.aksi]||'Perubahan';
        return `<tr><td class="p-3 whitespace-nowrap">${new Date(row.waktu).toLocaleString('id-ID',{timeZone:'Asia/Jakarta'})}</td><td class="p-3">${escapeHtml(row.aktor)}</td><td class="p-3"><b>${aksi}</b> · ${escapeHtml(auditLabels[row.tabel]||row.tabel)}<br>${escapeHtml(row.objek)}</td><td class="p-3">${diffs?`<details><summary class="cursor-pointer text-teal-700">Lihat perubahan</summary><ul>${diffs}</ul></details>`:'Data diperbarui'}</td></tr>`;
      }).join('');
      let message='';
      if(loading)message='Memuat aktivitas…';
      else if(error)message=error;
      else if(DB.mode==='demo')message='Log database tersedia saat terhubung ke Supabase.';
      else if(!rows.length)message=Object.values(auditView.filters).some(Boolean)?'Tidak ada aktivitas yang cocok dengan filter.':'Belum ada perubahan sejak pencatatan diaktifkan.';
      const f=auditView.filters;
      const field='block w-full mt-1 rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm text-slate-800';
      return `<section class="glass-card rounded-2xl overflow-hidden"><header class="p-4 flex justify-between items-center gap-3"><div><h2 class="font-bold">Log Aktivitas</h2><p class="text-xs text-slate-500">Perubahan data kas · Waktu Indonesia Barat</p></div><button class="border rounded-xl px-3 py-2 text-xs" onclick="loadAuditPage()">Muat terbaru</button></header>
        <form onsubmit="applyAuditFilters(event)" class="p-4 border-y border-slate-200 bg-slate-50 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 text-xs font-semibold text-slate-600">
          <label>Dari tanggal (WIB)<input type="date" name="dari" class="${field}" value="${escapeHtml(f.dari||'')}"></label>
          <label>Sampai tanggal (WIB)<input type="date" name="sampai" class="${field}" value="${escapeHtml(f.sampai||'')}"></label>
          <label>Pelaku<input type="search" name="pelaku" class="${field}" placeholder="Email atau sebagian nama akun" value="${escapeHtml(f.pelaku||'')}"></label>
          <label>Jenis aktivitas<select name="aksi" class="${field}">${[['','Semua aktivitas'],['INSERT','Tambah'],['UPDATE','Ubah'],['DELETE','Hapus']].map(([v,label])=>`<option value="${v}" ${v===f.aksi?'selected':''}>${label}</option>`).join('')}</select></label>
          <div class="flex gap-3 sm:col-span-2"><button class="rounded-xl bg-teal-700 px-3 py-2 text-white">Terapkan filter</button><button type="button" onclick="auditView.filters={};loadAuditPage()" class="px-3 py-2">Reset filter</button></div>
        </form>
        ${message?`<p class="p-4 text-sm" role="status">${escapeHtml(message)}</p>`:`<div class="overflow-x-auto"><table class="w-full min-w-[640px] text-left text-sm"><thead class="bg-teal-50"><tr>${['Waktu (WIB)','Pelaku','Aktivitas','Detail'].map(x=>`<th class="p-3">${x}</th>`).join('')}</tr></thead><tbody class="divide-y">${records}</tbody></table></div>`}
        ${!loading && !error && (older||cursors.length>1)?`<footer class="flex justify-between p-4 text-sm"><button ${cursors.length===1?'disabled':''} onclick="loadAuditPage('newer')">Lebih baru</button><button ${!older?'disabled':''} onclick="loadAuditPage('older')">Lebih lama</button></footer>`:''}</section>`;
    }

      }

      const tab = State.settingsTab;
      return `
        <div class="space-y-5 animate-fade-up">

    async function saveMember(e, editId) {
      e.preventDefault();
      if (!isAdmin()) return;
      const button=e.currentTarget.querySelector('[type=submit]');
      if(button.disabled)return;
      const password=document.getElementById('mem-password')?.value || '';
      if(password && password!=='ipd32' && password.length<6)return showToast('Kata sandi baru perlu minimal 6 karakter.', 'error');
      button.disabled=true;
      let profileSaved=false;
      const payload = {
        nama: document.getElementById('mem-nama').value.trim(),
        peran: document.getElementById('mem-peran').value,
        username: document.getElementById('mem-user').value.trim().toLowerCase(),

        status: document.getElementById('mem-status').value,
        aktif_sejak: document.getElementById('mem-sejak').value || State.data.anggota.find(m => m.id === editId)?.aktif_sejak || '',
        catatan_status: document.getElementById('mem-catatan').value.trim(),
      };
      try {
        if (editId) {
          await DB.updateRow('anggota', editId, payload);
          profileSaved=true;
          if(password){
            const {data}=await DB.client.auth.getSession();
            await akunRequest({aksi:'atur',member_id:editId,username:payload.username,baru:password},data.session?.access_token);
          }
          showToast('Data anggota diperbarui.', 'success');
        } else {
          await DB.insertRow('anggota', payload);
          showToast('Anggota baru ditambahkan.', 'success');
        }
        closeModal();
        await refreshData(true);
      } catch (err) {
        showToast((profileSaved?'Profil tersimpan. Kata sandi belum berhasil disimpan: ':'Gagal menyimpan anggota: ') + err.message, 'error');
      } finally {
        button.disabled=false;
      }
    }

    const healthTargets = [
      { label: 'Produksi', job: 'Cek produksi' },
      { label: 'kas-ipd32-dev', job: 'Cek kas-ipd32-dev' },
    ];
    const healthCache = { results: null, fetchedAt: 0, pending: null, pages: 1, hasMore: false };
    const completedHealthRuns = new Map();

    async function readHealthResults() {
      const root = 'https://api.github.com/repos/adminhostipd32-svg/KasIPD32/actions';
      async function read(path) {
        const response = await fetch(root + path, {
          credentials: 'omit', signal: AbortSignal.timeout(15000),
          headers: { Accept: 'application/vnd.github+json' },
        });
        if (!response.ok) throw new Error('GitHub HTTP ' + response.status);
        return response.json();
      }
      const workflow_runs = [];
      let total = 0;
      for (let page=1; page<=healthCache.pages; page++) {
        const batch = await read('/workflows/cek-supabase-kas.yml/runs?branch=main&per_page=8&page='+page);
        workflow_runs.push(...batch.workflow_runs);
        total = batch.total_count;
        if (batch.workflow_runs.length < 8) break;
      }
      const results = healthTargets.map(() => ({ latest: '', check: null, history: [] }));
      for (const [index, run] of workflow_runs.entries()) {
        const cacheKey = run.id + ':' + run.run_attempt;
        let jobs = completedHealthRuns.get(cacheKey);
        if (!jobs) {
          jobs = [];
          for (let page=1; ; page++) {
            const batch = await read('/runs/' + run.id + '/jobs?filter=all&per_page=100&page='+page);
            jobs.push(...batch.jobs);
            if (batch.jobs.length < 100) break;
          }
          if (run.status==='completed' && jobs.length) completedHealthRuns.set(cacheKey,jobs);
        }
        healthTargets.forEach((target, i) => {
          const row = results[i];
          const matching = jobs.filter(j => j.name === target.job || (i === 0 && j.name === 'cek-database')).sort((a,b)=>b.id-a.id);
          const job = matching[0];
          const step = job?.steps?.find(s => s.name.startsWith('Periksa akses baca ke periode kas'));
          if (index === 0) {
            if (run.status !== 'completed' && (!job || job.status !== 'completed')) row.latest = 'Pemeriksaan berikutnya sedang berjalan atau menunggu giliran.';
            else if (!step || !['success','failure','timed_out'].includes(step.conclusion)) row.latest = 'Run terbaru belum menghasilkan pemeriksaan database.';
          }
          for (const attempt of matching) {
            const finished = attempt.steps?.find(s=>s.name.startsWith('Periksa akses baca ke periode kas'));
            if (finished?.completed_at && ['success','failure','timed_out'].includes(finished.conclusion)) {
              row.history.push({id:attempt.id, ok:finished.conclusion==='success', time:finished.completed_at});
            }
          }
        });
      }
      for (const row of results) {
        row.history = [...new Map(row.history.map(check=>[check.id,check])).values()].sort((a,b)=>Date.parse(b.time)-Date.parse(a.time)||b.id-a.id);
        row.check = row.history[0] || null;
      }
      healthCache.hasMore = workflow_runs.length < total;
      return results;
    }

    class DatabaseCheckPanel extends HTMLElement {
      filters = {from:'', until:'', status:''};
      applyHistoryFilters(form) {
        const {from,until,status} = form.elements;
        if (from.value && until.value && from.value > until.value) {
          until.setCustomValidity('Tanggal akhir harus sama atau sesudah tanggal awal.');
          until.reportValidity();
          until.setCustomValidity('');
          return;
        }
        this.filters = {from:from.value, until:until.value, status:status.value};
        this.drawHistory();
      }
      drawHistory() {
        const list = this.querySelector('[data-history-list]');
        if (!list) return;
        const {from,until,status} = this.filters;
        const active = Boolean(from || until || status);
        const fromMs = from ? Date.parse(from+'T00:00:00+07:00') : -Infinity;
        const untilMs = until ? Date.parse(until+'T00:00:00+07:00')+86400000 : Infinity;
        list.innerHTML = healthTargets.map((target,i)=>{
          const history = healthCache.results?.[i]?.history || [];
          const rows = history.map((check,index)=>{
            const ms = Date.parse(check.time);
            const state = !check.ok ? 'failed' : history[index+1]?.ok===false ? 'recovered' : 'success';
            if (ms < fromMs || ms >= untilMs || (status && state!==status)) return '';
            const when = new Date(ms).toLocaleString('id-ID',{timeZone:'Asia/Jakarta',dateStyle:'medium',timeStyle:'medium'});
            const label = {failed:'Gagal',recovered:'Berhasil kembali',success:'Berhasil'}[state];
            return `<li class="flex flex-wrap gap-2 items-center justify-between px-4 py-2 text-xs"><time datetime="${escapeHtml(check.time)}">${when} WIB</time><b class="${check.ok?'text-emerald-700':'text-rose-700'}">${label}</b></li>`;
          }).join('');
          const empty = active ? 'Tidak ada hasil yang cocok pada riwayat yang dimuat.' : 'Belum ada hasil yang dimuat.';
          return `<div class="rounded-xl border border-slate-200 overflow-hidden"><h4 class="bg-teal-50 px-4 py-2 font-semibold">${target.label}</h4>${rows?`<ol class="divide-y max-h-80 overflow-y-auto">${rows}</ol>`:`<p class="p-4 text-sm text-slate-500">${empty}</p>`}</div>`;
        }).join('');
      }
      connectedCallback() { this.refresh(); }
      async older() {
        if (healthCache.pending || !healthCache.hasMore || State.session?.role !== 'it_support') return;
        healthCache.pages++;
        await this.refresh(true);
      }
      async refresh(force = false) {
        if (State.session?.role !== 'it_support') return;
        const draw = (busy, error = '') => {
          if (!this.isConnected || State.session?.role !== 'it_support') return;
          this.innerHTML = `<section class="glass-card rounded-2xl p-5 space-y-4"><header class="flex flex-wrap justify-between items-center gap-3">
            <div><h2 class="font-bold text-slate-900">Pengecekan database</h2><p class="text-xs text-slate-500">GitHub Actions · Jadwal 07.17, 15.17, dan 23.17 WIB</p></div>
            <button type="button" ${busy?'disabled':''} class="rounded-xl border px-3 py-2 text-xs font-semibold" onclick="this.closest('database-check-panel').refresh(true)">${busy?'Memuat…':'Muat status terbaru'}</button></header>
            ${error?`<p role="status" class="text-sm text-amber-800">Status terbaru belum bisa dimuat. ${escapeHtml(error)}${healthCache.results?' · Menampilkan hasil terakhir yang tersimpan.':''}</p>`:''}
            <div class="grid gap-3 sm:grid-cols-2">${healthTargets.map((target,i)=>{
              const row = healthCache.results?.[i], check = row?.check;
              const time = check ? new Date(check.time).toLocaleString('id-ID',{timeZone:'Asia/Jakarta',dateStyle:'long',timeStyle:'medium'})+' WIB' : '';
              return `<div class="rounded-xl border border-slate-200 p-4"><div class="flex justify-between gap-2 items-center"><h3 class="font-bold">${target.label}</h3>
                <span class="rounded-full px-2.5 py-1 text-xs font-bold ${check?(check.ok?'bg-emerald-50 text-emerald-800':'bg-rose-50 text-rose-800'):'bg-slate-100 text-slate-600'}">${check?(check.ok?'Berhasil':'Gagal'):'Belum tersedia'}</span></div>
                <p class="mt-2 text-sm text-slate-600">${time?'Terakhir diperiksa · '+time:busy?'Memuat waktu pemeriksaan…':'Belum ada waktu pemeriksaan yang tersedia.'}</p>
                ${row?.latest?`<p class="mt-1 text-xs text-slate-500">${row.latest}</p>`:''}</div>`;
            }).join('')}</div>
            <h3 class="font-bold text-slate-900">Riwayat pengecekan</h3>
            <form class="grid gap-3 sm:grid-cols-3 bg-slate-50 rounded-xl p-3 text-xs font-semibold" onsubmit="event.preventDefault();this.closest('database-check-panel').applyHistoryFilters(this)">
              <label>Dari tanggal (WIB)<input class="block w-full mt-1 border rounded-lg p-2" type="date" name="from" value="${escapeHtml(this.filters.from)}"></label>
              <label>Sampai tanggal (WIB)<input class="block w-full mt-1 border rounded-lg p-2" type="date" name="until" value="${escapeHtml(this.filters.until)}"></label>
              <label>Status<select class="block w-full mt-1 border rounded-lg p-2" name="status">${[['','Semua status'],['failed','Gagal'],['recovered','Berhasil kembali'],['success','Berhasil']].map(([value,label])=>`<option value="${value}" ${value===this.filters.status?'selected':''}>${label}</option>`).join('')}</select></label>
              <div class="flex gap-3"><button class="rounded-lg bg-teal-700 text-white px-3 py-2">Terapkan filter</button><button type="button" onclick="this.form.elements.from.value='';this.form.elements.until.value='';this.form.elements.status.value='';this.form.requestSubmit()">Reset</button></div>
            </form>
            <div data-history-list class="grid gap-3 sm:grid-cols-2" aria-live="polite"></div>
            ${healthCache.hasMore?`<button type="button" ${busy?'disabled':''} class="rounded-xl border px-3 py-2 text-xs font-semibold" onclick="this.closest('database-check-panel').older()">Muat riwayat lebih lama</button>`:''}</section>`;
          this.drawHistory();
        };
        if (!force && healthCache.results && Date.now()-healthCache.fetchedAt < 60000) { draw(false); return; }
        draw(true);
        try {
          healthCache.pending ??= readHealthResults().then(results=>{
            healthCache.results=results; healthCache.fetchedAt=Date.now();
          }).finally(()=>{ healthCache.pending=null; });
          await healthCache.pending;
          draw(false);
        } catch(err) { draw(false,err.message); }
      }
    }
    customElements.define('database-check-panel', DatabaseCheckPanel);

    function renderTabSupabase() {
      if (State.session?.role !== 'it_support') return '';
      return `<database-check-panel class="block mb-4"></database-check-panel><section class="glass-card rounded-2xl p-5 space-y-4">
        <h2 class="font-bold">Sistem &amp; Backup</h2>
        <p>Lingkungan: ${DB.mode === 'demo' ? 'DEMO' : isProduction ? 'PROD' : 'DEV'}</p>
        <button class="btn px-3 py-2 border rounded-xl" onclick="exportBackupJson()">Unduh backup JSON</button>

      </section>`;
    }

    function exportBackupJson() {
      if (State.session?.role !== 'it_support') return;
      const blob = new Blob([JSON.stringify(State.data, (k,v)=>k==='password'?undefined:v, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Backup_KAS_IPD32_${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('File backup JSON berhasil diunduh.', 'success');
    }

    // Tutup modal dengan tombol Escape
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    // Jalankan aplikasi saat DOM siap
    window.addEventListener('DOMContentLoaded', bootstrap);
  </script>
  <script src="./kas-bulanan.js"></script>
</body>
</html>

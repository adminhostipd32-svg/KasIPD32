const DEFAULT_SUPABASE_URL = isProduction

const DEFAULT_SUPABASE_ANON_KEY = isProduction

    /* ============================================================================
       SQL MIGRATION SCRIPT (SIAP SALIN KE SUPABASE SQL EDITOR)
    ============================================================================ */
    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatRp(amount, showPlus = false) {
      const num = Number(amount) || 0;
      const abs = Math.abs(num);
      const formatted = new Intl.NumberFormat('id-ID').format(abs);
      if (num < 0) return `-Rp ${formatted}`;
      if (num > 0 && showPlus) return `+Rp ${formatted}`;
      return `Rp ${formatted}`;
    }

    function formatCompactRp(amount) {
      const num = Number(amount) || 0;
      const abs = Math.abs(num);
      const sign = num < 0 ? '-' : '';
      if (abs >= 1000000) return `${sign}Rp ${(abs / 1000000).toFixed(2).replace('.', ',')} jt`;
      if (abs >= 1000) return `${sign}Rp ${Math.round(abs / 1000)} rb`;
      return `${sign}Rp ${abs}`;
    }

    function formatDateId(dateStr) {
      if (!dateStr) return '-';
      const d = new Date(dateStr + 'T00:00:00');
      if (isNaN(d.getTime())) return dateStr;
      return d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
    }

    function generateUuid() {
      if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => {
        const r = (Math.random() * 16) | 0;
        const v = c === 'x' ? r : (r & 0x3) | 0x8;
        return v.toString(16);
      });
    }

    function copyTextToClipboard(text, successMsg = 'Berhasil disalin ke clipboard') {
      try {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.left = '-9999px';
        textarea.style.top = '0';
        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(textarea);
        if (ok) showToast(successMsg, 'success');
        else showToast('Gagal menyalin teks. Silakan salin manual.', 'error');
      } catch (err) {
        showToast('Gagal menyalin teks: ' + err.message, 'error');
      }
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const id = 'toast-' + Date.now() + Math.random().toString(36).slice(2, 6);
      const styles = {
        success: 'bg-emerald-50/95 border-emerald-200 text-emerald-800',
        error: 'bg-rose-50/95 border-rose-200 text-rose-800',
        warning: 'bg-amber-50/95 border-amber-200 text-amber-800',
        info: 'bg-white/95 border-slate-200 text-slate-800',
      };
      const icons = {
        success: 'check-circle-2',
        error: 'alert-circle',
        warning: 'alert-triangle',
        info: 'info',
      };
      const el = document.createElement('div');
      el.id = id;
      el.className = `pointer-events-auto flex items-start gap-2.5 px-4 py-3 rounded-2xl border shadow-float backdrop-blur-md text-sm font-medium animate-fade-up ${styles[type] || styles.info}`;
      el.innerHTML = `
        <i data-lucide="${icons[type] || 'info'}" class="w-4 h-4 mt-0.5 shrink-0"></i>
        <span class="flex-1 leading-snug">${escapeHtml(message)}</span>
        <button onclick="document.getElementById('${id}')?.remove()" class="opacity-60 hover:opacity-100 p-0.5">
          <i data-lucide="x" class="w-3.5 h-3.5"></i>
        </button>
      `;
      container.appendChild(el);
      if (window.lucide) lucide.createIcons();
      setTimeout(() => {
        const node = document.getElementById(id);
        if (node) {
          node.style.opacity = '0';
          node.style.transition = 'opacity 0.25s ease';
          setTimeout(() => node.remove(), 260);
        }
      }, 3600);
    }

    /* ============================================================================
       MODAL CONTROLLER (TANPA alert() / confirm())
    ============================================================================ */
    function formatMoneyInput(input) {
      const before = input.value;
      const digits = before.replace(/\./g, '');
      input.setCustomValidity('');
      if (digits && !/^\d+$/.test(digits)) {
        input.setCustomValidity('Gunakan angka rupiah bulat tanpa tanda minus atau koma.');
        return;
      }
      if (!digits) { input.value = ''; return; }
      const amount = Number(digits);
      if (!Number.isSafeInteger(amount) || amount < Number(input.dataset.min || 0)) input.setCustomValidity('Periksa nominal rupiah.');
      const remaining = before.slice(input.selectionStart ?? before.length).replace(/\D/g, '').length;
      input.value = digits.replace(/^0+(?=\d)/,'').replace(/\B(?=(\d{3})+(?!\d))/g,'.');
      let cursor = input.value.length;
      for (let n = 0; cursor > 0 && n < remaining;) {
        if (/\d/.test(input.value[--cursor])) n++;
      }
      input.setSelectionRange(cursor,cursor);
    }

    function moneyValue(id) { return Number(document.getElementById(id).value.replace(/\./g,'')); }

    function openModal(htmlContent, maxWidthClass = 'max-w-lg') {
      const root = document.getElementById('modal-root');
      root.innerHTML = `
        <div class="w-full ${maxWidthClass} bg-white rounded-2xl shadow-2xl border border-slate-200/90 overflow-hidden animate-fade-up my-auto max-h-[90vh] flex flex-col" onclick="event.stopPropagation()">
          ${htmlContent}
        </div>
      `;
      root.classList.remove('hidden');
      root.onclick = null;
      root.querySelectorAll('[data-money]').forEach(input => {
        formatMoneyInput(input);
        input.addEventListener('input', () => formatMoneyInput(input));
      });
      if (window.lucide) lucide.createIcons();
    }

    function closeModal() {
      const root = document.getElementById('modal-root');
      root.classList.add('hidden');
      root.innerHTML = '';
    }

    function openConfirmModal({ title, message, confirmLabel = 'Ya, Lanjutkan', danger = false, onConfirm }) {
      const btnColor = danger
        ? 'bg-rose-600 hover:bg-rose-700 text-white'
        : 'bg-teal-700 hover:bg-teal-800 text-white';
      const iconBg = danger ? 'bg-rose-50 text-rose-600' : 'bg-teal-50 text-teal-700';
      const iconName = danger ? 'trash-2' : 'help-circle';

      window.__pendingConfirm = async () => {
        closeModal();
        if (typeof onConfirm === 'function') await onConfirm();
      };

      openModal(`
        <div class="p-6">
          <div class="flex items-start gap-4">
            <div class="w-11 h-11 rounded-2xl ${iconBg} flex items-center justify-center shrink-0">
              <i data-lucide="${iconName}" class="w-5 h-5"></i>
            </div>
            <div class="flex-1 min-w-0">
              <h3 class="text-base font-bold text-slate-900">${escapeHtml(title)}</h3>
              <p class="text-sm text-slate-600 mt-1.5 leading-relaxed">${escapeHtml(message)}</p>
            </div>
          </div>
          <div class="flex items-center justify-end gap-2.5 mt-6">
            <button onclick="closeModal()" class="px-4 py-2.5 rounded-xl text-sm font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 transition active:scale-[0.98]">
              Batal
            </button>
            <button onclick="window.__pendingConfirm()" class="px-4 py-2.5 rounded-xl text-sm font-semibold ${btnColor} transition active:scale-[0.98] shadow-sm">
              ${escapeHtml(confirmLabel)}
            </button>
          </div>
        </div>
      `, 'max-w-md');
    }

    const DB = {
      mode: 'offline',
      client: null,
      url: '',
      key: '',

      init() {
        const savedUrl = (DEFAULT_SUPABASE_URL || '').trim();
        const savedKey = (DEFAULT_SUPABASE_ANON_KEY || '').trim();
        this.url = savedUrl;
        this.key = savedKey;

        if (savedUrl && savedKey && window.supabase && typeof window.supabase.createClient === 'function') {
          try {
            this.client = window.supabase.createClient(savedUrl.replace(/\/rest\/v1\/?$/, ''), savedKey);
            this.mode = 'supabase';
          } catch (e) {
            console.error('Supabase init error:', e);
            this.mode = 'offline';
            this.client = null;
          }
        } else {
          this.mode = 'offline';
          this.client = null;
        }
      },

      async readPages(table, column = 'id', ascending = true) {
        const rows = [];
        const size = 500;
        for (let offset = 0; ; offset += size) {
          let query = this.client.from(table).select(table==='anggota'?memberColumns:'*').order(column, { ascending });
          if (column !== 'id') query = query.order('id');
          const { data, error } = await query.range(offset, offset + size - 1);
          if (error) throw new Error(error.message);
          rows.push(...data);
          if (data.length < size) return { data: rows };
        }
      },

      async fetchAll() {
        const [p, a, i, lb, t, pe, pp] = await Promise.all([
          this.readPages('periode_kas', 'tahun', true),
          this.readPages('anggota', 'nama', true),
          this.readPages('iuran_kas'),
          this.readPages('saldo_lebih_bayar'),
          this.readPages('transaksi_kas', 'tanggal', false),
          this.readPages('patungan_event', 'tahun', false),
          this.readPages('patungan_peserta', 'nama_peserta', true),
        ]);
        
        return {
          aggregate: State.session?.role==='anggota' ? await rpcKas('ringkasan_kas') : null,
          periode_kas: p.data || [],
          anggota: a.data || [],
          iuran_kas: i.data || [],
          saldo_lebih_bayar: lb.data || [],
          transaksi_kas: t.data || [],
          patungan_event: pe.data || [],
          patungan_peserta: pp.data || [],
        };
      },

      async logout() {
        if (this.mode === 'supabase') {
          try {
            await this.client.auth.signOut();
          } catch (_) {}
        }
        localStorage.removeItem(STORAGE_KEYS.SESSION);
      },

      // Generic CRUD operations
      async upsertIuran(record) {
        const { error } = await this.client
          .from('iuran_kas')
          .upsert(record, { onConflict: 'anggota_id,tahun,bulan' });
        if (error) throw new Error(error.message);
      },

      async deleteIuran(anggota_id, tahun, bulan) {
        const { error } = await this.client
          .from('iuran_kas')
          .delete()
          .eq('anggota_id', anggota_id)
          .eq('tahun', tahun)
          .eq('bulan', bulan);
        if (error) throw new Error(error.message);
      },

      async upsertLebihBayar(record) {
        const { error } = await this.client
          .from('saldo_lebih_bayar')
          .upsert({ ...record, updated_at: new Date().toISOString() }, { onConflict: 'anggota_id,tahun' });
        if (error) throw new Error(error.message);
      },

      async insertRow(table, payload) {
        const { data, error } = await this.client.from(table).insert(payload).select(table==='anggota'?memberColumns:'*').single();
        if (error) throw new Error(error.message);
        return data;
      },

      async insertRows(table, payloads) {
        if (!payloads.length) return;
        const { error } = await this.client.from(table).insert(payloads);
        if (error) throw new Error(error.message);
      },

      async updateRow(table, id, payload) {
        const { error } = await this.client.from(table).update(payload).eq('id', id);
        if (error) throw new Error(error.message);
      },

      async deleteRow(table, id) {
        const { error } = await this.client.from(table).delete().eq('id', id);
        if (error) throw new Error(error.message);
      },
    };

    /* ============================================================================
       GLOBAL APPLICATION STATE
    ============================================================================ */
    const State = {
      session: null, // { role: 'admin'|'anggota', id, nama, ... }
      activePage: 'dashboard', // 'dashboard' | 'iuran' | 'transaksi' | 'patungan' | 'pengaturan'

        anggota: [],

      // Filters
      selectedYear: 2026,
      reportMonth: 0,
      reportYear: null,
      personalYear: 0,
      dashboardScope: 'personal',
      masterYear: 0,
      iuranSearch: '',
      iuranStatusFilter: 'Semua',

      txMonthFilter: 'Semua',
      txTypeFilter: 'Semua',
      txSearch: '',
      patYearFilter: 'Semua',
      patSearch: '',
      participantSearch: '',
      reportMember: '',
      patStatusFilter: 'Semua',
      activePatunganId: null,
      settingsTab: 'anggota', // 'anggota' | 'periode' | 'supabase'
      memberSearch: '',
    };

    function isAdmin() {
      return State.session?.role==='admin';
    }

    function getTarifForYear(tahun) {
      const p = State.data.periode_kas.find((x) => Number(x.tahun) === Number(tahun));
      return p ? Number(p.tarif_bulanan) : 20000;
    }

    function getAvailableYears() {
      const years = State.data.periode_kas.map((p) => Number(p.tahun)).sort((a, b) => a - b);
      return years.length ? years : [2023, 2024, 2025, 2026];
    }

    /* ============================================================================
       PERHITUNGAN KEUANGAN & REKAP TAHUNAN OTOMATIS
    ============================================================================ */
    function computeAnnualRecap() {
      const years = getAvailableYears();
      let runningSaldo = 0;
      const rows = years.map((yr) => {
        const periode = State.data.periode_kas.find((p) => Number(p.tahun) === yr);
        const tarif = periode ? Number(periode.tarif_bulanan) : 0;

        const totalIuran = State.data.aggregate ? Number(State.data.aggregate.iuran[yr]||0) : State.data.iuran_kas
          .filter((i) => Number(i.tahun) === yr)
          .reduce((acc, cur) => acc + (Number(cur.nominal) || 0), 0);

        const totalLebihBayar = State.data.aggregate ? Number(State.data.aggregate.lebih[yr]||0) : State.data.saldo_lebih_bayar
          .filter((lb) => Number(lb.tahun) === yr)
          .reduce((acc, cur) => acc + (Number(cur.nominal) || 0), 0);

        const totalMasukLain = State.data.transaksi_kas
          .filter((t) => Number(t.tahun) === yr && t.tipe === 'masuk_lain')
          .reduce((acc, cur) => acc + (Number(cur.nominal) || 0), 0);

        const totalKeluar = State.data.transaksi_kas
          .filter((t) => Number(t.tahun) === yr && t.tipe === 'keluar')
          .reduce((acc, cur) => acc + (Number(cur.nominal) || 0), 0);

        const totalMasuk = totalIuran + totalLebihBayar + totalMasukLain;
        const saldoTahun = totalMasuk - totalKeluar;
        runningSaldo += saldoTahun;

        return {
          tahun: yr,
          tarif,
          totalIuran,
          totalLebihBayar,
          totalMasukLain,
          totalMasuk,
          totalKeluar,
          saldoTahun,
          saldoKumulatif: runningSaldo,
        };
      });

      const grandMasuk = rows.reduce((a, r) => a + r.totalMasuk, 0);
      const grandKeluar = rows.reduce((a, r) => a + r.totalKeluar, 0);
      const grandSaldo = grandMasuk - grandKeluar;

      return { rows, grandMasuk, grandKeluar, grandSaldo };
    }

    function computePatunganStats(eventId) {
      if(State.data.aggregate?.acara[eventId])return State.data.aggregate.acara[eventId];
      const ev = State.data.patungan_event.find((e) => e.id === eventId);
      if (!ev) return { terkumpul: 0, targetTotal: 0, pengeluaran: 0, selisih: 0, lunasCount: 0, totalPeserta: 0 };
      const list = State.data.patungan_peserta.filter((p) => p.patungan_id === eventId);
      const terkumpul = list.reduce((a, p) => a + (Number(p.nominal_bayar) || 0), 0);
      const targetTotal = list.reduce((a, p) => a + (Number(p.tarif_target) || 0), 0);
      const pengeluaran = Number(ev.total_pengeluaran) || 0;
      const selisih = terkumpul - pengeluaran;
      const lunasCount = list.filter((p) => p.status_bayar === 'Lunas').length;
      return { terkumpul, targetTotal, pengeluaran, selisih, lunasCount, totalPeserta: list.length };
    }

    const tableOrders = new Map();
    const idCollator = new Intl.Collator('id', { numeric: true, sensitivity: 'base' });

    function installTableSorting(root) {
      for (const table of root.querySelectorAll('table')) {
        if (!table.tHead || !table.tBodies.length) continue;
        const headers = Array.from(table.tHead.rows[0].cells);
        const key = headers.map(th => th.textContent.trim()).join('|');
        const body = table.tBodies[0];
        function applyOrder(column, direction) {
          headers.forEach((th, i) => th.setAttribute('aria-sort', i !== column ? 'none' : direction === 1 ? 'ascending' : 'descending'));
          function value(row) {
            const cell = row.cells[column];
            const raw = cell.dataset.value ?? cell.textContent.trim();
            if (/^[+-]?Rp\s*[\d.]+$/.test(raw)) return Number(raw.replace(/[^0-9+-]/g, ''));
            return raw;
          }
          const rows = Array.from(body.rows).filter(row => row.cells.length === headers.length);
          rows.sort((a, b) => {
            const left = value(a), right = value(b);
            return direction * (typeof left === 'number' && typeof right === 'number' ? left - right : idCollator.compare(left, right));
          });
          body.append(...rows);
        }
        headers.forEach((th, column) => {
          if (th.textContent.trim() === 'Aksi') return;
          const button = document.createElement('button');
          button.type = 'button';
          button.textContent = th.textContent.trim();
          button.title = 'Urutkan berdasarkan ' + button.textContent;
          button.onclick = () => {
            const previous = tableOrders.get(key);
            const direction = previous?.column === column ? -previous.direction : 1;
            tableOrders.set(key, { column, direction });
            applyOrder(column, direction);
          };
          th.replaceChildren(button);
        });
        const order = tableOrders.get(key);
        if (order) applyOrder(order.column, order.direction);
      }
    }

    /* ============================================================================
       4. PAGE: MATRIKS IURAN KAS 12 BULAN
    ============================================================================ */
    function joinDateParts(value) {
      const raw = String(value || '').trim();
      const exact = /^(\d{4})-(\d{2})-(\d{2})$/.exec(raw);
      if (exact) return { year: Number(exact[1]), month: Number(exact[2]), day: Number(exact[3]), iso: raw };
      // Older profiles recorded a month/year or only a year. Keep their original precision.
      const year = /\b(\d{4})\b/.exec(raw);
      const month = MONTHS.find(m => raw.toLowerCase().includes(m.full.toLowerCase()));
      return { year: year ? Number(year[1]) : 0, month: month?.num || 1, day: null, iso: '' };
    }

    function firstDuesMonth(member, year) {
      const start = joinDateParts(member.aktif_sejak);
      if (year < start.year) return 13;
      return year === start.year ? start.month : 1;
    }

    function joinDateLabel(value) {
      const d = joinDateParts(value);
      return d.iso ? d.day + ' ' + MONTHS[d.month-1]?.full + ' ' + d.year : value || '';
    }

    function membershipForYear(member, year) {
      if (firstDuesMonth(member, year) > 12) return null;
      const years = (member.catatan_status || '').match(/\b20\d{2}\b/g) || [];
      const left = /\b(?:resign|mutasi|pindah|keluar|tidak aktif setelah)\b[^.;\n]{0,45}?\b(20\d{2})\b/i.exec(member.catatan_status || '');
      if (member.status !== 'Aktif' && left && years.length === 1) {
        if (year > Number(left[1])) return null;
        if (year < Number(left[1])) return 'Aktif';
      }
      return member.status;
    }

    function memberDues(member, year, rate, today = new Date()) {
      const first = firstDuesMonth(member, year);
      const last = year === today.getFullYear() ? today.getMonth() + 1 : year < today.getFullYear() ? 12 : 0;
      const paid = new Map(State.data.iuran_kas
        .filter(i => i.anggota_id === member.id && Number(i.tahun) === year)
        .map(i => [Number(i.bulan), Number(i.nominal)]));
      return MONTHS.filter(m => m.num >= first && m.num <= last)
        .map(m => ({ ...m, remaining: Math.max(0, rate - (paid.get(m.num) || 0)) }));
    }

    function memberBalanceForYear(member,year,throughMonth) {
      const status = membershipForYear(member,year);
      const rate=getTarifForYear(year);
      let months=status ? memberDues(member,year,rate,new Date(year,11,31)).filter(m=>m.num<=throughMonth) : [];
      let note='';
      if (status && status!=='Aktif') {
        const text=(member.catatan_status||'').toLowerCase();
        const end=MONTHS.find(m=>text.includes(m.full.toLowerCase()) || new RegExp('\\b'+m.short.toLowerCase()+'(?:t)?\\b').test(text));
        if(end && text.includes(String(year))) months=months.filter(m=>m.num<=end.num);
        else if(!text.includes(`setelah ${year}`)){
          months=months.filter(m=>State.data.iuran_kas.some(p=>p.anggota_id===member.id && Number(p.tahun)===year && Number(p.bulan)===m.num));
          note='Batas kewajiban anggota nonaktif belum lengkap. Bulan yang belum memiliki setoran perlu dikonfirmasi bendahara.';
        }
      }
      const now=new Date();
      const pending = months.filter(m=>m.remaining>0).map(m=>({
        ...m, target:rate, paid:rate-m.remaining,
        future:year>now.getFullYear() || (year===now.getFullYear() && m.num>now.getMonth()+1)
      }));
      const events = new Map(State.data.patungan_event.filter(e=>Number(e.tahun)===year).map(e=>[e.id,e.nama_event]));
      const unpaid = State.data.patungan_peserta.filter(p=>p.anggota_id===member.id && events.has(p.patungan_id) && Number(p.tarif_target)>Number(p.nominal_bayar))
        .map(p=>({name:events.get(p.patungan_id),target:Number(p.tarif_target),paid:Number(p.nominal_bayar),remaining:Number(p.tarif_target)-Number(p.nominal_bayar)}));
      return {year,pending,unpaid,note};
    }

    function yearOptions(year) {
      return `<option value="0" ${!year?'selected':''}>Semua tahun</option>`+getAvailableYears().map(y=>`<option value="${y}" ${y===year?'selected':''}>${y}</option>`).join('');
    }

    function memberBalanceCard(member, year, throughMonth = 12, showHeading = true) {
      if (!member) return '';
      const years = year ? [year] : getAvailableYears();
      const periods = years.map(y => memberBalanceForYear(member,y,throughMonth));
      const sum = (rows,key) => rows.reduce((total,row)=>total+row[key],0);
      const yearly = periods.map(p=>{
        const dues = sum(p.pending,'remaining');
        const future = sum(p.pending.filter(m=>m.future),'remaining');
        const events = sum(p.unpaid,'remaining');
        return {year:p.year, dues, future, events, total:dues+events};
      });
      const total = sum(yearly,'total');
      const future = sum(yearly,'future');
      const cues = [
        ['Total belum dibayar',total,'total','wallet'], ['Sisa iuran',sum(yearly,'dues'),'dues','calendar-days'],
        ['Sisa patungan',sum(yearly,'events'),'events','users'], ['Iuran belum jatuh tempo',future,'future','clock']
      ];
      const duesRows = periods.flatMap(p=>p.pending.map(m=>[m.full+' '+p.year,m.future?'Belum jatuh tempo':'Belum lunas',formatRp(m.target),formatRp(m.paid),formatRp(m.remaining)]));
      const eventRows = periods.flatMap(p=>p.unpaid.map(e=>[e.name,p.year,formatRp(e.target),formatRp(e.paid),formatRp(e.remaining)]));
      return `<section class="space-y-4">${showHeading?`<h3 class="font-bold text-slate-900">${escapeHtml(member.nama)} · ${year||'Semua tahun'}</h3>`:''}
        <div class="report-tiles">${cues.map(([label,v,tone,icon])=>`<div class="report-tile tile-${tone}"><i data-lucide="${icon}" aria-hidden="true"></i><p>${label}</p><strong>${formatRp(v)}</strong></div>`).join('')}</div>
        <p class="text-xs text-slate-500">Total mencakup iuran sampai ${MONTHS[throughMonth-1].full}, termasuk bulan mendatang, serta sisa patungan tahun acara.</p>
        ${reportTable('Rekap per tahun',['Tahun','Sisa iuran','Sisa patungan','Total belum dibayar'],yearly.filter(y=>y.total>0).map(y=>[y.year,formatRp(y.dues),formatRp(y.events),formatRp(y.total)]),'Tidak ada sisa tagihan yang tercatat.')}
        ${reportTable('Rincian iuran',['Bulan','Status','Target','Dibayar','Sisa'],duesRows,'Tidak ada sisa iuran pada periode ini.')}
        ${reportTable('Rincian patungan',['Acara','Tahun','Target','Dibayar','Sisa'],eventRows,'Tidak ada sisa patungan pada periode ini.')}
        ${periods.filter(p=>p.note).map(p=>`<p class="text-xs text-slate-500">${p.year} · ${p.note}</p>`).join('')}</section>`;
    }

    function reportTable(title, headers, rows, empty = '', cellAction = null) {
      const [tone,icon] = ({
        'Rincian iuran':['dues','calendar-days'],'Rincian patungan':['events','users'],
        'Patungan acara':['events','users'],'Penggunaan dana':['expense','arrow-up-right'],
        'Arus kas':['general','arrow-left-right']
      })[title] || ['general','landmark'];
      const cells = rows.map((row,rowIndex) => `<tr class="hover:bg-slate-50/70 transition">${row.map((v,i) => `<td class="px-4 py-3 ${i ? 'text-right whitespace-nowrap tabular-nums font-semibold' : 'text-left font-medium'}">${cellAction?.(v,i,rowIndex) ?? escapeHtml(String(v))}</td>`).join('')}</tr>`).join('');
      return `<section class="glass-card rounded-2xl overflow-hidden min-w-0">
        <h3 class="report-section-title section-${tone}"><i aria-hidden="true" data-lucide="${icon}"></i>${title}</h3>${rows.length
        ? `<div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="bg-slate-50/95 border-y border-slate-200 text-[11px] font-bold uppercase tracking-wider text-slate-500">${headers.map((h,i) => `<th scope="col" class="px-4 py-3 whitespace-nowrap ${i ? 'text-right' : 'text-left'}">${h}</th>`).join('')}</tr></thead><tbody class="divide-y divide-slate-200/70">${cells}</tbody></table></div>`
        : `<p class="px-5 pb-5 text-sm text-slate-500">${empty}</p>`}</section>`;
    }

    function openExpenseMonth(year,month) {
      State.txYearFilter=String(year);
      State.txMonthFilter=String(month);
      State.txTypeFilter='keluar';
      State.txSearch='';
      navigateTo('transaksi');
    }

    function renderReportPage() {
      if (!staffAccess()) return '';
      const reportYear = State.reportYear ?? Number(State.selectedYear);
      const year = reportYear || getAvailableYears().at(-1);
      const month = reportYear ? State.reportMonth : 0;
      const annual = computeAnnualRecap().rows.find(r => r.tahun === year);
      if (!annual || !State.data.periode_kas.length) return '<p>Data periode kas belum tersedia.</p>';
      const total = records => records.reduce((sum, r) => sum + Number(r.nominal || 0), 0);
      const tx = State.data.transaksi_kas.filter(r => Number(r.tahun) === year);
      const dues = State.data.iuran_kas.filter(r => Number(r.tahun) === year);
      const months = MONTHS.map(m => {
        const entries = tx.filter(r => Number(r.bulan) === m.num);
        const iuran = total(dues.filter(r => Number(r.bulan) === m.num));
        const other = total(entries.filter(r => r.tipe === 'masuk_lain'));
        const spent = total(entries.filter(r => r.tipe === 'keluar'));
        return { ...m, iuran, other, spent, net: iuran + other - spent };
      });
      const selected = month ? [months[month - 1]] : months;
      const opening = annual.saldoKumulatif - annual.saldoTahun + months.filter(m => m.num < month).reduce((s,m) => s + m.net, 0);
      const income = selected.reduce((s,m) => s + m.iuran + m.other, month && month!==12 ? 0 : annual.totalLebihBayar);
      const spent = selected.reduce((s,m) => s + m.spent, 0);
      const summary = [
        ['Saldo awal', opening, 'wallet', 'bg-sky-50 text-sky-700'],
        ['Pemasukan', income, 'arrow-down-left', 'bg-emerald-50 text-emerald-700'],
        ['Pengeluaran', spent, 'arrow-up-right', 'bg-rose-50 text-rose-700'],
        ['Saldo akhir', opening + income - spent, 'landmark', 'bg-teal-50 text-teal-700'],
      ];
      const categories = new Map();
      for (const row of tx.filter(r => r.tipe === 'keluar' && (!month || Number(r.bulan) === month))) {
        const key = row.kategori || 'Lainnya';
        categories.set(key, (categories.get(key) || 0) + Number(row.nominal));
      }
      const events = State.data.patungan_event.filter(e => Number(e.tahun) === year);
      const periodLabel = reportYear ? `${month ? MONTHS[month - 1].full : 'Tahun'} ${year}` : 'Semua tahun';
      const selectStyle = 'rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm font-semibold text-slate-700 focus:ring-2 focus:ring-teal-600/25';
      return `<div class="space-y-5 animate-fade-up">
        <div class="report-banner ${State.reportMember?'personal-banner':'general-banner'}">
          <div><h1>Laporan Anggota</h1><p>${State.reportMember?'Tagihan per anggota':'Rekap kas ruangan'} · ${periodLabel}</p></div>
          <button class="inline-flex items-center justify-center gap-2 self-start sm:self-auto px-4 py-2.5 rounded-xl bg-white hover:bg-slate-100 text-teal-900 text-xs font-bold shadow-sm transition active:scale-[0.98]" onclick="printMemberReport()"><i data-lucide="printer" class="w-4 h-4"></i>Cetak / Simpan PDF</button>
        </div>
        <div class="glass-card rounded-2xl p-4 grid grid-cols-2 sm:flex sm:items-end gap-3">
          <label class="grid gap-1.5 text-xs font-semibold text-slate-500">Tahun<select class="${selectStyle}" id="report-year" onchange="State.reportYear=Number(this.value);renderApp()">${yearOptions(reportYear)}</select></label>
          <label class="grid gap-1.5 text-xs font-semibold text-slate-500">Periode<select class="${selectStyle}" ${reportYear ? '' : 'disabled'} onchange="State.reportMonth=Number(this.value);renderApp()"><option value="0">Tahunan</option>${MONTHS.map(m=>`<option value="${m.num}" ${month===m.num?'selected':''}>${m.full}</option>`).join('')}</select></label>
          <label class="grid gap-1.5 text-xs font-semibold text-slate-500 col-span-2">Jenis laporan<select class="${selectStyle}" onchange="State.reportMember=this.value;renderApp()"><option value="">Rekap kas bersama</option>${State.data.anggota.map(m=>`<option value="${escapeHtml(m.id)}" ${State.reportMember===m.id?'selected':''}>Tagihan · ${escapeHtml(m.nama)}</option>`).join('')}</select></label>
        </div>
        <article id="member-report" class="space-y-4">
        <header class="hidden"><h2>Laporan kas IPD 32</h2><p>${periodLabel} · Disusun ${new Date().toLocaleDateString('id-ID')}</p></header>
        ${State.reportMember ? memberBalanceCard(State.data.anggota.find(m=>m.id===State.reportMember),reportYear,month||12) : !reportYear ? reportTable('Rekap kas semua tahun',['Tahun','Pemasukan','Pengeluaran','Saldo tahun','Saldo kumulatif'],computeAnnualRecap().rows.map(r=>[r.tahun,formatRp(r.totalMasuk),formatRp(r.totalKeluar),formatRp(r.saldoTahun),formatRp(r.saldoKumulatif)])) : `<div class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4">${summary.map(([label,v,icon,tone])=>`<div class="report-tile ${tone}">
          <div class="flex items-center justify-between gap-1 mb-3"><span class="text-[11px] font-bold uppercase tracking-wider text-slate-500">${label}</span>
          <span aria-hidden="true" class="w-7 h-7 sm:w-9 sm:h-9 shrink-0 rounded-xl flex items-center justify-center ${tone}"><i data-lucide="${icon}" class="w-4 h-4"></i></span></div>
          <strong class="text-base sm:text-xl xl:text-2xl font-extrabold tabular-nums ${v < 0 ? 'text-rose-700' : 'text-slate-900'}">${formatRp(v)}</strong></div>`).join('')}</div>
        ${reportTable('Arus kas', ['Bulan','Iuran','Masuk lain','Keluar','Lebih bayar','Selisih'],selected.map(m=>[m.full,...[m.iuran,m.other,m.spent,m.num===12?annual.totalLebihBayar:0,m.net+(m.num===12?annual.totalLebihBayar:0)].map(v=>formatRp(v))]), '', (v,col,row)=>col===3 ? `<button class="text-teal-700 underline" onclick="openExpenseMonth(${year},${selected[row].num})" title="Rincian pengeluaran ${selected[row].full}">${escapeHtml(v)}</button>` : null)}
        <p class="text-sm">${month ? 'Lebih bayar tahunan dicatat pada Desember.' : `Lebih bayar tahunan ${formatRp(annual.totalLebihBayar)} sudah termasuk dalam pemasukan dan saldo akhir.`}</p>
        ${reportTable('Penggunaan dana', ['Kategori','Jumlah'], [...categories].sort((a,b)=>b[1]-a[1]).map(([k,v])=>[k,formatRp(v)]),'Belum ada pengeluaran tercatat pada periode ini.')}
        ${month ? '' : reportTable('Patungan acara', ['Acara','Terkumpul','Biaya','Selisih'],events.map(e=>{const stats=computePatunganStats(e.id);return [e.nama_event,formatRp(stats.terkumpul),formatRp(stats.pengeluaran),formatRp(stats.selisih)];}),'Belum ada acara tercatat pada tahun ini.')}
        ${!month && events.length ? '<p class="text-sm">Dampak patungan pada saldo mengikuti transaksi yang tercatat di Buku Kas.</p>' : ''}`}</article></div>`;
    }

    function printMemberReport() {
      const report = document.getElementById('member-report');
      if (!State.session || !report) return;
      const preview = window.open('', '_blank');
      if (!preview) return showToast('Izinkan jendela cetak untuk menyimpan PDF.', 'error');
      const doc = preview.document;
      doc.title = 'Laporan Kas IPD 32 - ' + report.querySelector('header p').textContent.split(' · ')[0];
      doc.documentElement.lang = 'id';
      const style = doc.createElement('style');
      style.textContent = '@page{size:A4;margin:14mm}body{font:11pt Arial;color:#173536}h2,h3{break-after:avoid}article svg{display:none}.report-tiles,article>.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.report-tile{border:1px solid #cbd5e1;padding:6px}.report-tile strong{font-variant-numeric:tabular-nums}table{width:100%;border-collapse:collapse}th,td{padding:5px;border-bottom:1px solid #ccc;text-align:right}th:first-child,td:first-child{text-align:left}th button{all:unset}tr{break-inside:avoid}p{margin:8px 0}';
      doc.head.append(style);
      doc.body.append(doc.importNode(report,true));
      preview.focus();
      preview.print();
    }

    function renderIuranPage() {
      const years = getAvailableYears();
      const activeYr = Number(State.selectedYear);
      const tarif = getTarifForYear(activeYr);
      const admin = isAdmin();

      // Index pembayaran untuk pencarian cepat O(1)
      const iuranMap = {};
      State.data.iuran_kas
        .filter((i) => Number(i.tahun) === activeYr)
        .forEach((i) => {
          iuranMap[`${i.anggota_id}_${i.bulan}`] = i;
        });

      const lebihMap = {};
      State.data.saldo_lebih_bayar
        .filter((l) => Number(l.tahun) === activeYr)
        .forEach((l) => {
          lebihMap[l.anggota_id] = l;
        });

      // Filter anggota
      const searchQ = State.iuranSearch.trim().toLowerCase();
      const eligible = State.data.anggota
        .map(member => ({ ...member, status: membershipForYear(member, activeYr) }))
        .filter(member => member.status || lebihMap[member.id] || MONTHS.some(m => iuranMap[`${member.id}_${m.num}`]))
        .map((m) => {
          const due = memberDues(m, activeYr, tarif, new Date(activeYr, 11, 31));
          let totalBayar = 0;
          for (let b = 1; b <= 12; b++) {
            const cell = iuranMap[`${m.id}_${b}`];
            if (cell && Number(cell.nominal) > 0) {
              totalBayar += Number(cell.nominal);
            }
          }
          const lebihObj = lebihMap[m.id];
          const lebihNominal = lebihObj ? Number(lebihObj.nominal) : 0;
          const derivedStatus =
            !m.status ? 'Riwayat setoran' : m.status !== 'Aktif' ? m.status : !due.length ? 'Belum jatuh tempo' :
            due.some(month => month.remaining > 0) ? 'Kurang Bayar' : 'Lunas';

          return { member: m, totalBayar, lebihNominal, lebihObj, derivedStatus, firstMonth: firstDuesMonth(m, activeYr) };
        });
      const rows = eligible.filter((r) => {
          if (searchQ && !r.member.nama.toLowerCase().includes(searchQ)) return false;
          if (State.iuranStatusFilter === 'Semua') return true;
          if (State.iuranStatusFilter === 'Aktif') return r.member.status === 'Aktif';
          if (State.iuranStatusFilter === 'Lunas') return r.derivedStatus === 'Lunas';
          if (State.iuranStatusFilter === 'Kurang Bayar') return r.derivedStatus === 'Kurang Bayar';
          if (State.iuranStatusFilter === 'Non-Aktif') return !!r.member.status && r.member.status !== 'Aktif';
          return true;
        });

      // Hitung total per bulan di footer
      const monthTotals = Array(13).fill(0);
      let grandIuran = 0;
      let grandLebih = 0;
      rows.forEach((r) => {
        grandIuran += r.totalBayar;
        grandLebih += r.lebihNominal;
        for (let b = 1; b <= 12; b++) {
          const c = iuranMap[`${r.member.id}_${b}`];
          if (c) monthTotals[b] += Number(c.nominal) || 0;
        }
      });

      const statusPill = (st) => {
        if (st === 'Lunas') return `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-50 text-emerald-700 border border-emerald-200/70">Lunas</span>`;
        if (st === 'Kurang Bayar') return `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-50 text-amber-700 border border-amber-200/70">Kurang</span>`;
        return `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-rose-50 text-rose-700 border border-rose-200/70">${escapeHtml(st)}</span>`;
      };

      return `
        <div class="space-y-5 animate-fade-up">
          <!-- Header -->
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div>
              <h1 class="text-2xl font-extrabold tracking-tight text-slate-900">Matriks Iuran Kas ${activeYr}</h1>
              <p class="text-sm text-slate-500 mt-0.5">
                Status lunas dihitung sampai Desember. Tarif wajib: <b class="text-teal-700 tabular-nums">${formatRp(tarif)} / bulan</b>
                ${admin ? ' • Klik sel bulan atau kolom Lebih Bayar untuk input cepat' : ' • Mode Transparansi Anggota'}
              </p>
            </div>
            <div class="flex flex-wrap items-center gap-2">
              <button onclick="printIuran()" class="px-3.5 py-2 rounded-xl bg-white border text-xs font-semibold">Cetak / Simpan PDF</button>
              <button onclick="exportIuranCsv()" class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-white border border-slate-200 text-xs font-semibold text-slate-700 hover:bg-slate-50 transition">
                <i data-lucide="download" class="w-3.5 h-3.5"></i>
                <span>Ekspor CSV</span>
              </button>
              ${
                admin
                  ? `
                  <button onclick="State.settingsTab='periode'; navigateTo('pengaturan')" class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-teal-700 hover:bg-teal-800 text-white text-xs font-semibold shadow-sm transition">
                    <i data-lucide="sliders-horizontal" class="w-3.5 h-3.5"></i>
                    <span>Atur Tarif / Tahun</span>
                  </button>
                `
                  : ''
              }
            </div>
          </div>

          <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
            ${[['Total anggota', eligible.filter(r => r.member.status).length], ['Lunas s.d. Desember', eligible.filter(r => r.derivedStatus === 'Lunas').length],
              ['Kurang bayar', eligible.filter(r => r.derivedStatus === 'Kurang Bayar').length],
              ['Nonaktif', eligible.filter(r => r.member.status && r.member.status !== 'Aktif').length]].map(([label, value]) =>
              `<div class="glass-card rounded-xl p-3"><p class="text-xs text-slate-500">${label}</p><strong>${value}</strong></div>`).join('')}
          </div>
          <!-- Top Action & Filter Bar -->
          <div class="glass-card rounded-2xl p-3.5 flex flex-col md:flex-row items-stretch md:items-center justify-between gap-3">
            <div class="flex flex-wrap items-center gap-2">
              <!-- Year Selector -->
              <div class="relative">
                <select
                  onchange="State.selectedYear=Number(this.value); renderApp();"
                  class="pl-3.5 pr-8 py-2 rounded-xl border border-slate-200 bg-white text-xs font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-teal-600/25">
                  ${years.map((y) => `<option value="${y}" ${y === activeYr ? 'selected' : ''}>Tahun ${y}</option>`).join('')}
                </select>
              </div>

              <!-- Status Filter Pills -->
              <div class="flex items-center gap-1 flex-wrap">
                ${['Semua', 'Lunas', 'Kurang Bayar', 'Non-Aktif']
                  .map(
                    (st) => `
                  <button
                    onclick="State.iuranStatusFilter='${st}'; renderApp();"
                    class="px-3 py-1.5 rounded-xl text-xs font-semibold transition ${
                      State.iuranStatusFilter === st
                        ? 'bg-teal-700 text-white shadow-sm'
                        : 'bg-slate-100 text-slate-600 hover:bg-slate-200/80'
                    }">
                    ${st}
                  </button>
                `
                  )
                  .join('')}
              </div>
            </div>

            <!-- Search Input -->
            <div class="relative md:w-64">
              <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
              <input
                type="text"
                value="${escapeHtml(State.iuranSearch)}"
                id="iuranSearch" oninput="updateSearch(this)"
                placeholder="Cari nama anggota..."
                class="w-full pl-9 pr-3 py-2 rounded-xl border border-slate-200 bg-white text-xs text-slate-800 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-teal-600/25"
              />
            </div>
          </div>

          <!-- 12-Month Matrix Table -->
          <div class="glass-card rounded-2xl overflow-hidden">
            <div class="overflow-x-auto">
              <table id="matrix" class="w-full text-left border-collapse min-w-[1120px]">
                <thead>
                  <tr class="bg-slate-50/95 border-b border-slate-200 text-[11px] font-bold uppercase tracking-wider text-slate-500">
                    <th class="sticky left-0 z-20 bg-slate-50 py-3 px-3 w-10 text-center">No</th>
                    <th class="sticky left-10 z-20 bg-slate-50 py-3 px-3 min-w-[175px] sticky-col-shadow">Nama Anggota</th>
                    ${MONTHS.map((m) => `<th class="py-3 px-2 text-center w-[68px]">${m.short}</th>`).join('')}
                    <th class="py-3 px-3 text-right min-w-[105px]">Total</th>
                    <th class="py-3 px-3 text-right min-w-[95px]">Lebih Bayar</th>
                    <th class="py-3 px-3 min-w-[130px]">Catatan</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-200/70 text-xs">
                  ${
                    rows.length === 0
                      ? `<tr><td colspan="17" class="py-12 text-center text-sm text-slate-400">Tidak ada data anggota yang cocok dengan filter.</td></tr>`
                      : rows
                          .map((r, idx) => {
                            const isSelf = !admin && State.session?.id === r.member.id;
                            return `
                              <tr data-member="${escapeHtml(r.member.id)}" data-status="${escapeHtml(r.member.status || 'Belum masuk')}" data-payment-status="${escapeHtml(r.derivedStatus)}" class="${isSelf ? 'bg-teal-50/40' : 'hover:bg-slate-50/70'} transition">
                                <td class="sticky left-0 z-10 ${isSelf ? 'bg-teal-50/95' : 'bg-white'} py-2.5 px-3 text-center font-semibold text-slate-400 tabular-nums">
                                  ${idx + 1}
                                </td>
                                <td class="sticky left-10 z-10 ${isSelf ? 'bg-teal-50/95' : 'bg-white'} py-2.5 px-3 sticky-col-shadow">
                                  <div class="flex items-center justify-between gap-2">
                                    <div class="min-w-0">
                                      <div class="font-bold text-slate-900 truncate max-w-[125px]" title="${escapeHtml(r.member.nama)}">
                                        ${escapeHtml(r.member.nama)}
                                      </div>
                                      <div class="text-[10px] text-slate-400">${escapeHtml(r.member.peran)}</div>
                                    </div>
                                    ${statusPill(r.derivedStatus)}
                                  </div>
                                </td>

                                ${MONTHS.map((m) => {
                                  const cell = iuranMap[`${r.member.id}_${m.num}`];
                                  const nominal = cell ? Number(cell.nominal) : 0;
                                  const beforeJoining = m.num < r.firstMonth;
                                  if (beforeJoining && !nominal) return '<td class="text-center text-xs text-slate-400" title="Belum masuk pada bulan ini">Belum masuk</td>';
                                  const isAnomaly = nominal > 0 && nominal > tarif * 2;
                                  const clickable = admin
                                    ? `onclick="openIuranCellModal('${r.member.id}', ${activeYr}, ${m.num})"`
                                    : '';
                                  if (nominal > 0) {
                                    return `
                                      <td data-value="${nominal}" class="py-2 px-1 text-center">
                                        <div ${clickable} title="${
                                          isAnomaly ? 'Perhatian: Nominal melebihi 2x tarif bulanan!' : formatRp(nominal)
                                        }" class="mx-auto py-1.5 px-1 rounded-lg font-bold tabular-nums text-[11px] transition ${
                                          isAnomaly || (!beforeJoining && nominal < tarif)
                                            ? 'bg-amber-100 text-amber-800 border border-amber-300'
                                            : 'bg-emerald-50 text-emerald-700 border border-emerald-200/70'
                                        }">
                                          ${Math.round(nominal / 1000)}k
                                          ${beforeJoining ? '<small class="block">Sebelum masuk</small>' : nominal < tarif ? `<small class="block">Kurang ${formatRp(tarif - nominal)}</small>` : ''}
                                        </div>
                                      </td>
                                    `;
                                  }
                                  return `
                                    <td data-value="${nominal}" class="py-2 px-1 text-center">
                                      <div ${clickable} class="mx-auto py-1.5 px-1 rounded-lg text-[11px] text-slate-300 border border-dashed border-slate-200/80 ${
                                        admin ? 'hover:bg-slate-100 hover:text-slate-500' : ''
                                      }">
                                        —
                                      </div>
                                    </td>
                                  `;
                                }).join('')}

                                <td class="py-2.5 px-3 text-right font-bold tabular-nums text-slate-900">
                                  ${formatRp(r.totalBayar)}
                                </td>
                                <td class="py-2.5 px-3 text-right">
                                  <button
                                    ${admin ? `onclick="openLebihBayarModal('${r.member.id}', ${activeYr})"` : 'disabled'}
                                    class="tabular-nums font-semibold px-2 py-1 rounded-lg ${
                                      r.lebihNominal > 0
                                        ? 'bg-sky-50 text-sky-700 border border-sky-200/70'
                                        : 'text-slate-400'
                                    } ${admin ? 'hover:bg-sky-100 cursor-pointer' : 'cursor-default'}">
                                    ${r.lebihNominal > 0 ? formatRp(r.lebihNominal) : 'Rp 0'}
                                  </button>
                                </td>
                                <td class="py-2.5 px-3 text-[11px] text-slate-500 max-w-[160px] truncate" title="${escapeHtml(r.member.catatan_status || '')}">
                                  ${admin ? `<button class="text-teal-700 hover:underline" title="Edit catatan anggota" onclick="openMemberNote('${r.member.id}')">${escapeHtml(r.member.catatan_status || 'Tambah catatan')}</button>` : escapeHtml(r.member.catatan_status || '—')}
                                </td>
                              </tr>
                            `;
                          })
                          .join('')
                  }
                </tbody>
                <tfoot>
                  <tr class="bg-slate-100/90 border-t-2 border-slate-200 text-[11px] font-extrabold text-slate-900">
                    <td class="sticky left-0 z-10 bg-slate-100 py-3 px-3"></td>
                    <td class="sticky left-10 z-10 bg-slate-100 py-3 px-3 sticky-col-shadow">TOTAL (${rows.length} org)</td>
                    ${MONTHS.map(
                      (m) => `<td data-value="${monthTotals[m.num]}" class="py-3 px-1 text-center tabular-nums text-teal-800">${monthTotals[m.num] > 0 ? Math.round(monthTotals[m.num] / 1000) + 'k' : '0'}</td>`
                    ).join('')}
                    <td class="py-3 px-3 text-right tabular-nums text-emerald-700">${formatRp(grandIuran)}</td>
                    <td class="py-3 px-3 text-right tabular-nums text-sky-700">${formatRp(grandLebih)}</td>
                    <td class="py-3 px-3 text-right tabular-nums text-slate-700">${formatRp(grandIuran + grandLebih)}</td>
                  </tr>
                </tfoot>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    function openIuranCellModal(anggotaId, tahun, bulan) {
      if (!isAdmin()) return;
      const member = State.data.anggota.find((a) => a.id === anggotaId);
      const tarif = getTarifForYear(tahun);
      const existing = State.data.iuran_kas.find(
        (i) => i.anggota_id === anggotaId && Number(i.tahun) === Number(tahun) && Number(i.bulan) === Number(bulan)
      );
      const monthName = MONTHS[bulan - 1]?.full || bulan;
      const todayStr = new Date().toISOString().slice(0, 10);

      openModal(`
        <div class="p-5 border-b border-slate-200 flex items-center justify-between">
          <div>
            <h3 class="text-base font-bold text-slate-900">Input Iuran • ${monthName} ${tahun}</h3>
            <p class="text-xs text-slate-500 mt-0.5">${escapeHtml(member?.nama || '')} • Tarif standar ${formatRp(tarif)}</p>
          </div>
          <button onclick="closeModal()" class="p-1.5 rounded-xl text-slate-400 hover:bg-slate-100"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        <form onsubmit="saveIuranCell(event, '${anggotaId}', ${tahun}, ${bulan})" class="p-5 space-y-4">
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Nominal Bayar (Rp)</label>
            <input id="iu-nominal" type="text" inputmode="numeric" data-money data-min="0" required value="${existing ? existing.nominal : tarif}"
              oninput="checkIuranAnomaly(moneyValue(this.id), ${tarif})"
              class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm font-bold tabular-nums focus:outline-none focus:ring-2 focus:ring-teal-600/25" />

    function checkIuranAnomaly(val, tarif) {
      const el = document.getElementById('iu-anomaly-warn');
      if (!el) return;
      if (Number(val) > tarif * 2) el.classList.remove('hidden');
      else el.classList.add('hidden');
    }

    async function saveIuranCell(e, anggota_id, tahun, bulan) {
      e.preventDefault();
      const nominal = moneyValue('iu-nominal') || 0;
      const tanggal_bayar = document.getElementById('iu-tanggal').value || new Date().toISOString().slice(0, 10);
      const keterangan = document.getElementById('iu-ket').value.trim();
      try {
        if (nominal <= 0) {
          await DB.deleteIuran(anggota_id, tahun, bulan);
          showToast('Pembayaran bulan tersebut dikosongkan.', 'info');
        } else {
          await DB.upsertIuran({ anggota_id, tahun, bulan, nominal, tanggal_bayar, keterangan });
          showToast('Iuran berhasil disimpan.', 'success');
        }
        closeModal();
        await refreshData(true);
      } catch (err) {
        showToast('Gagal menyimpan iuran: ' + err.message, 'error');
      }
    }

    function printIuran() {
      const preview = window.open('', '_blank');
      if (!preview) return showToast('Izinkan jendela cetak untuk menyimpan PDF.', 'error');
      const doc = preview.document;
      doc.documentElement.lang = 'id';
      doc.title = 'Matriks Iuran Kas ' + State.selectedYear;
      const heading = doc.createElement('h1');
      heading.textContent = doc.title;
      const table = doc.createElement('table');
      for (const section of document.getElementById('matrix').children) {
        const target = doc.createElement(section.localName);
        for (const source of section.rows) {
          const row = target.insertRow();
          for (const cell of source.cells) {
            const copy = doc.createElement(cell.localName);
            copy.colSpan = cell.colSpan;
            copy.textContent = cell.hasAttribute('data-value') ? formatRp(cell.dataset.value) : cell.innerText.trim();
            row.append(copy);
          }
        }
        table.append(target);
      }
      const style = doc.createElement('style');
      style.textContent = '@page{size:A4 landscape;margin:8mm}body{font:9px Arial}table{width:100%;border-collapse:collapse}td,th{padding:3px;border:1px solid #aaa}tr{break-inside:avoid}tfoot{display:table-row-group}';
      doc.head.append(style);
      doc.body.append(heading, table);
      preview.focus();
      preview.print();
    }

    function exportIuranCsv() {
      const yr = Number(State.selectedYear);
      const iuranMap = {};
      State.data.iuran_kas.filter((i) => Number(i.tahun) === yr).forEach((i) => { iuranMap[`${i.anggota_id}_${i.bulan}`] = i.nominal; });
      const lebihMap = {};
      State.data.saldo_lebih_bayar.filter((l) => Number(l.tahun) === yr).forEach((l) => { lebihMap[l.anggota_id] = l.nominal; });

      const headers = ['No', 'Nama', 'Peran', 'Status anggota', 'Status iuran tahunan', ...MONTHS.map((m) => m.short), 'Total Iuran', 'Lebih Bayar'];
      const lines = [headers.join(',')];
      Array.from(document.querySelectorAll('#matrix tbody tr[data-member]')).forEach((row, idx) => {
        const m = State.data.anggota.find(member => member.id === row.dataset.member);
        let tot = 0;
        const mCols = MONTHS.map((mo) => {
          const v = Number(iuranMap[`${m.id}_${mo.num}`]) || 0;
          tot += v;
          return v;
        });
        const lb = Number(lebihMap[m.id]) || 0;
        lines.push([idx + 1, `"${m.nama.replace(/"/g, '""')}"`, m.peran, row.dataset.status, row.dataset.paymentStatus, ...mCols, tot, lb].join(','));
      });

      const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Matriks_Iuran_IPD32_${yr}.csv`;
      a.click();
      URL.revokeObjectURL(url);
      showToast(`File CSV Matriks ${yr} berhasil diunduh.`, 'success');
    }

        return merged.map((c) => `<option value="${escapeHtml(c)}" ${c === selectedCat ? 'selected' : ''}>${escapeHtml(c)}</option>`).join('');
